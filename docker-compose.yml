services:
  galaxy:
    build: .
    ports:
      - '3000:3000'
    environment:
      # The public URL players use. Required for sign-in forms to pass the CSRF check.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - galaxy-data:/data # SQLite database (accounts, saves, scores)
      - ./games:/app/games # games are read live from disk: add or edit without rebuilding
    restart: unless-stopped

volumes:
  galaxy-data:
