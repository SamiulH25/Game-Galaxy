<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Paper Drift</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="Paper Drift river game"></canvas>

    <div class="paper-grain" aria-hidden="true"></div>

    <header id="hud" class="hud">
      <div class="hud-row">
        <div class="hud-stat">
          <span class="hud-label">Leagues</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-stat hud-stat--center">
          <span class="hud-label" id="soggy-label">Sogginess 0%</span>
          <div class="soggy-track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-label="Sogginess">
            <div id="soggy-fill" class="soggy-fill"></div>
          </div>
        </div>
        <div class="hud-stat hud-stat--right">
          <span class="hud-label">Lives</span>
          <strong id="lives" class="lives" aria-label="Lives remaining">♥♥♥</strong>
        </div>
      </div>
      <p class="hud-hint">Move to steer · Click / tap to fold</p>
    </header>

    <div id="overlay" class="overlay is-open" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div class="overlay-card">
        <h1 id="overlay-title">Paper Drift</h1>
        <p id="overlay-text"></p>
        <button type="button" id="overlay-btn" class="btn">Cast off</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
