<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Voyager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <div class="hud">
            <div class="hud-top">
                <div class="hud-box">
                    <div class="hud-label">Score</div>
                    <div class="hud-value" id="scoreDisplay">0</div>
                </div>
                
                <div class="hud-box health-container">
                    <div class="hud-label">Hull Integrity</div>
                    <div class="health-bar">
                        <div class="health-fill" id="healthBar" style="width: 100%"></div>
                    </div>
                    <div class="health-text" id="healthText">100</div>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-label">Escape Progress</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            
            <div class="controls-hint">
                <span>WASD</span> Move<br>
                <span>Space/Q</span> Ascend<br>
                <span>Shift/E</span> Descend<br>
                <span>Click</span> Shoot<br>
                <span>P/Esc</span> Pause
            </div>
        </div>
        
        <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-title" id="gameOverTitle">VOID CONSUMED</div>
            <div class="game-over-score" id="finalScore">Score: 0</div>
            <button class="btn" onclick="game.restart()">Try Again</button>
        </div>
        
        <div class="pause-overlay" id="pauseOverlay">
            <div class="pause-text">PAUSED</div>
        </div>
        
        <div class="notification" id="notification"></div>
    </div>
    
    <script src="shaders.js"></script>
    <script src="math.js"></script>
    <script src="renderer.js"></script>
    <script src="entities.js"></script>
    <script src="game.js"></script>
</body>
</html>
