<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Archive</title>
<script src="../bridge.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0410;font-family:'Segoe UI',system-ui,sans-serif;color:#e0c8d8}

#app{display:flex;flex-direction:column;height:100%;background:radial-gradient(ellipse at 50% 0%,#1a0a18,#0a0410 70%)}

/* Header */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(26,10,24,0.92);border-bottom:1px solid rgba(255,68,136,0.18);flex-wrap:wrap;z-index:10;flex-shrink:0}
header h1{font-size:13px;font-weight:700;color:#ff66aa;letter-spacing:.5px;margin-right:4px;white-space:nowrap}
header h1 em{font-style:normal;color:#44ddff}
header label{font-size:11px;color:rgba(224,200,216,0.4);display:flex;align-items:center;gap:4px}
header select,.file-btn{background:rgba(255,68,136,0.08);border:1px solid rgba(255,68,136,0.2);border-radius:4px;color:#e0c8d8;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;outline:none;transition:all.15s}
header select:hover,.file-btn:hover{border-color:rgba(255,68,136,0.45);background:rgba(255,68,136,0.12)}
header select option{background:#0a0410;color:#e0c8d8}
.file-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;position:relative}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.ctrl-btn{background:rgba(68,221,255,0.06);border:1px solid rgba(68,221,255,0.12);border-radius:4px;color:#88ddff;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:all.15s;white-space:nowrap}
.ctrl-btn:hover{border-color:#44ddff;background:rgba(68,221,255,0.12);color:#44ddff}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed;border-color:rgba(68,221,255,0.06)}
header .spacer{flex:1}
#rom-name{font-size:11px;color:rgba(224,200,216,0.25);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status-msg{font-size:10px;color:rgba(224,200,216,0.15);text-align:center;padding:2px 8px;transition:all.3s}
#status-msg.active{color:#44ddff}
#status-msg.error{color:#ff4466}

/* Emulator container */
#emulator-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#emulator-wrap .ejs_parent{width:100%;height:100%}
#drop-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;pointer-events:none;transition:opacity.3s}
#drop-overlay.drag-over{pointer-events:auto}
.drop-icon{font-size:48px;margin-bottom:10px;opacity:.2}
.drop-text{font-size:14px;color:rgba(224,200,216,0.2);text-align:center;line-height:1.6}
.drop-text strong{color:rgba(255,68,136,0.35)}
#drop-overlay.hidden{opacity:0}

/* Controls hint overlay */
#controls-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,4,16,0.85);border:1px solid rgba(255,68,136,0.12);border-radius:8px;padding:6px 14px;font-size:10px;color:rgba(224,200,216,0.2);z-index:15;pointer-events:none;text-align:center;max-width:90%;line-height:1.5;transition:opacity.5s}
#controls-hint strong{color:rgba(68,221,255,0.3)}
#controls-hint.hidden{opacity:0}

/* Bottom bar */
footer{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(10,4,16,0.9);border-top:1px solid rgba(255,68,136,0.08);flex-shrink:0;flex-wrap:wrap}
footer .foot-label{font-size:10px;color:rgba(224,200,216,0.15);margin-right:auto}
footer .foot-label strong{color:rgba(255,68,136,0.3)}

/* Loading spinner */
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:rgba(10,4,16,0.9);transition:opacity.4s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid rgba(255,68,136,0.1);border-top-color:#ff4488;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:12px;color:rgba(224,200,216,0.3)}
#loading p em{font-style:normal;color:#44ddff}

/* Responsive */
@media(max-width:600px){header{font-size:10px;gap:6px;padding:6px 8px}header h1{font-size:11px}header select,.file-btn,.ctrl-btn{font-size:10px;padding:3px 6px}#rom-name{max-width:100px}}@media(max-height:400px){#controls-hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>◈ <em>Retro</em> Archive</h1>
    <label>System <select id="system-select">
      <option value="nes">NES</option>
      <option value="snes">SNES</option>
      <option value="gb">Game Boy</option>
      <option value="gba" selected>GBA</option>
    </select></label>
    <label class="file-btn">📂 Load ROM<input type="file" id="rom-file" accept=".nes,.smc,.sfc,.gb,.gbc,.gba,.zip,application/zip"></label>
    <span id="rom-name"></span>
    <span class="spacer"></span>
    <button class="ctrl-btn" id="save-btn" disabled>💾 Save State</button>
    <button class="ctrl-btn" id="load-btn" disabled>📂 Load State</button>
    <button class="ctrl-btn" id="fs-btn">⛶ Fullscreen</button>
  </header>
  <div id="emulator-wrap">
    <div id="emulator-container"></div>
    <div id="drop-overlay" class="hidden">
      <div class="drop-icon">🎮</div>
      <div class="drop-text">Drop a ROM file here<br><strong>or click Load ROM above</strong></div>
    </div>
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Loading <em id="load-system">GBA</em> core…</p>
    </div>
    <div id="controls-hint">
      <strong>← → ↑ ↓</strong> D-Pad · <strong>Z</strong> B · <strong>X</strong> A · <strong>Enter</strong> Start · <strong>Shift</strong> Select
    </div>
  </div>
  <footer>
    <span class="foot-label"><strong>◈</strong> Drop a ROM to play</span>
    <span id="status-msg"></span>
  </footer>
</div>

<script>
'use strict';

const EJS_DATA = 'https://cdn.emulatorjs.org/stable/data/';
const LS_SAVE_KEY = 'retro-archive-save';
let currentSystem = 'gba';
let currentRomBlob = null;
let emulatorReady = false;
let saveStateData = null;

// ─── DOM ───
const systemSelect = document.getElementById('system-select');
const romFile = document.getElementById('rom-file');
const romName = document.getElementById('rom-name');
const saveBtn = document.getElementById('save-btn');
const loadBtn = document.getElementById('load-btn');
const fsBtn = document.getElementById('fs-btn');
const container = document.getElementById('emulator-container');
const dropOverlay = document.getElementById('drop-overlay');
const loading = document.getElementById('loading');
const loadSystem = document.getElementById('load-system');
const statusMsg = document.getElementById('status-msg');
const controlsHint = document.getElementById('controls-hint');

// ─── Status ───
function setStatus(msg, type) {
  statusMsg.textContent = msg;
  statusMsg.className = type || '';
}

// ─── System / controls hint ───
const CONTROLS = {
  nes: '← → ↑ ↓ D-Pad · Z B · X A · Enter Start · Shift Select · Space Turbo',
  snes: '← → ↑ ↓ D-Pad · Z B · X A · A Y · S L · D R · Enter Start · Shift Select',
  gb: '← → ↑ ↓ D-Pad · Z B · X A · Enter Start · Shift Select',
  gba: '← → ↑ ↓ D-Pad · Z B · X A · S L · D R · Enter Start · Shift Select',
};

function updateControlsHint(system) {
  controlsHint.innerHTML = '<strong>' + CONTROLS[system] + '</strong>';
}

// ─── Load emulator ───
function loadEmulator(system, romUrl) {
  emulatorReady = false;
  saveBtn.disabled = true;
  loadBtn.disabled = true;
  container.innerHTML = '';
  loading.classList.remove('hidden');
  loadSystem.textContent = system.toUpperCase();
  setStatus('Initializing ' + system.toUpperCase() + ' core…');

  // Clean up any previous EJS globals
  ['EJS_core','EJS_gameUrl','EJS_pathtodata','EJS_container','EJS_gameName','EJS_color','EJS_cheats','EJS_onGameStarted','EJS_onSaveState','EJS_onLoadState'].forEach(k => delete window[k]);

  // Wait for previous script to fully cleanup
  setTimeout(() => {
    window.EJS_core = system;
    window.EJS_gameUrl = romUrl;
    window.EJS_pathtodata = EJS_DATA;
    window.EJS_container = '#emulator-container';
    window.EJS_gameName = romName.textContent || 'Retro Game';
    window.EJS_color = '#ff4488';
    window.EJS_cheats = false;

    // Callback when emulator is ready
    window.EJS_onGameStarted = function() {
      emulatorReady = true;
      saveBtn.disabled = false;
      loadBtn.disabled = !saveStateData;
      loading.classList.add('hidden');
      setStatus('Ready', 'active');
      // Restore save state if we have one
      if (saveStateData && window.emulator && window.emulator.loadState) {
        try {
          window.emulator.loadState(saveStateData);
          setStatus('State restored', 'active');
        } catch(e) {
          setStatus('Could not restore state', 'error');
        }
      }
    };

    // Inject emulator script
    const script = document.createElement('script');
    script.src = 'https://cdn.emulatorjs.org/stable/emulator.min.js';
    script.onerror = function() {
      loading.classList.add('hidden');
      setStatus('Failed to load emulator. Check internet connection.', 'error');
    };
    document.head.appendChild(script);
  }, 100);
}

// ─── Handle ROM file ───
function loadRomFile(file) {
  if (!file) return;

  // Check file extension against selected system
  const ext = file.name.split('.').pop().toLowerCase();
  const validExts = { nes:['nes'], snes:['smc','sfc','swc','fig','bin'], gb:['gb','gbc'], gba:['gba'] };
  const valid = validExts[currentSystem];
  if (valid && !valid.includes(ext) && ext !== 'zip') {
    setStatus('Warning: ' + ext.toUpperCase() + ' may not work with ' + currentSystem.toUpperCase(), 'error');
  }

  romName.textContent = file.name;
  setStatus('Loading ' + file.name + '…');

  // Store ROM in IndexedDB for persistence
  storeRomInIndexedDB(currentSystem, file.name, file).then(() => {
    const url = URL.createObjectURL(file);
    currentRomBlob = url;
    loadEmulator(currentSystem, url);
    saveMeta();
  });
}

romFile.addEventListener('change', function() {
  if (this.files && this.files[0]) loadRomFile(this.files[0]);
});

// ─── Drag and drop ───
const wrap = document.getElementById('emulator-wrap');
wrap.addEventListener('dragover', function(e) {
  e.preventDefault();
  dropOverlay.classList.remove('hidden');
  dropOverlay.classList.add('drag-over');
});
wrap.addEventListener('dragleave', function() {
  dropOverlay.classList.remove('drag-over');
});
wrap.addEventListener('drop', function(e) {
  e.preventDefault();
  dropOverlay.classList.add('hidden');
  dropOverlay.classList.remove('drag-over');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) loadRomFile(e.dataTransfer.files[0]);
});
// Hide drop overlay when emulator is running (click anywhere to dismiss)
wrap.addEventListener('click', function() {
  if (currentRomBlob) dropOverlay.classList.add('hidden');
});

// ─── System switch ───
systemSelect.addEventListener('change', function() {
  currentSystem = this.value;
  updateControlsHint(currentSystem);
  saveMeta();
  if (currentRomBlob) {
    // Reload emulator with same ROM but new system
    // Need to get file from IndexedDB
    loadRomFromIndexedDB(currentSystem, romName.textContent).then(file => {
      if (file) {
        const url = URL.createObjectURL(file);
        currentRomBlob = url;
        loadEmulator(currentSystem, url);
      } else {
        setStatus('System changed. Load a ROM for ' + currentSystem.toUpperCase(), '');
      }
    }).catch(() => {
      setStatus('System changed. Load a ROM for ' + currentSystem.toUpperCase(), '');
    });
  } else {
    loading.classList.add('hidden');
  }
});

// ─── IndexedDB ROM storage ───
function openRomDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('RetroArchiveROMs', 1);
    req.onupgradeneeded = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('roms')) {
        db.createObjectStore('roms', { keyPath: 'key' });
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function storeRomInIndexedDB(system, name, file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const data = e.target.result;
      openRomDB().then(db => {
        const tx = db.transaction('roms', 'readwrite');
        tx.objectStore('roms').put({ key: system + '::' + name, data: data, system: system, name: name, timestamp: Date.now() });
        tx.oncomplete = function() { resolve(); db.close(); };
        tx.onerror = function() { reject(tx.error); };
      }).catch(reject);
    };
    reader.onerror = function() { reject(reader.error); };
    reader.readAsArrayBuffer(file);
  });
}

function loadRomFromIndexedDB(system, name) {
  if (!name) return Promise.resolve(null);
  return new Promise((resolve, reject) => {
    openRomDB().then(db => {
      const tx = db.transaction('roms', 'readonly');
      const req = tx.objectStore('roms').get(system + '::' + name);
      req.onsuccess = function() {
        db.close();
        if (req.result) {
          resolve(new File([req.result.data], req.result.name));
        } else {
          resolve(null);
        }
      };
      req.onerror = function() { reject(req.error); };
    }).catch(reject);
  });
}

function getAllStoredROMs() {
  return new Promise((resolve) => {
    openRomDB().then(db => {
      const tx = db.transaction('roms', 'readonly');
      const req = tx.objectStore('roms').getAll();
      req.onsuccess = function() {
        db.close();
        resolve(req.result || []);
      };
      req.onerror = function() { db.close(); resolve([]); };
    }).catch(() => resolve([]));
  });
}

// ─── Save/Load metadata (system, rom name) ───
function saveMeta() {
  const data = { system: currentSystem, romName: romName.textContent };
  try { localStorage.setItem(LS_SAVE_KEY, JSON.stringify(data)); } catch(_) {}
}

function loadMeta() {
  try {
    const raw = localStorage.getItem(LS_SAVE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.system) { currentSystem = data.system; systemSelect.value = currentSystem; }
      if (data.romName) romName.textContent = data.romName;
    }
  } catch(_) {}
}

// ─── Bridge save/load ───
async function handleBridgeSave() {
  if (!currentRomBlob) { setStatus('No ROM loaded', 'error'); return; }

  // Try to get save state from emulator
  let stateData = null;
  if (window.emulator && typeof window.emulator.saveState === 'function') {
    try {
      stateData = window.emulator.saveState();
    } catch(_) {}
  }

  const payload = {
    system: currentSystem,
    romName: romName.textContent,
    state: stateData || null,
  };

  // Also save ROM data to bridge for platform persistence
  const roms = await getAllStoredROMs();
  const currentRomMeta = roms.find(r => r.system === currentSystem && r.name === romName.textContent);
  if (currentRomMeta) {
    try {
      payload.romData = arrayBufferToBase64(currentRomMeta.data);
    } catch(_) {}
  }

  if (window.gameBridge) {
    try {
      await window.gameBridge.save(payload);
      setStatus('Saved!', 'active');
    } catch(_) {
      setStatus('Save failed', 'error');
    }
  } else {
    try { localStorage.setItem(LS_SAVE_KEY + '-bridge', JSON.stringify(payload)); } catch(_) {}
    setStatus('Saved locally', 'active');
  }
}

async function handleBridgeLoad() {
  let data = null;
  if (window.gameBridge) {
    try {
      data = await window.gameBridge.load();
    } catch(_) {}
  }
  if (!data) {
    try {
      const raw = localStorage.getItem(LS_SAVE_KEY + '-bridge');
      if (raw) data = JSON.parse(raw);
    } catch(_) {}
  }

  if (!data) { setStatus('No save found', 'error'); return; }

  if (data.system) {
    currentSystem = data.system;
    systemSelect.value = currentSystem;
    updateControlsHint(currentSystem);
  }
  if (data.romName) romName.textContent = data.romName;

  // Restore ROM from bridge or IndexedDB
  let romFile = null;

  // Try bridge ROM data first
  if (data.romData) {
    try {
      const binary = base64ToArrayBuffer(data.romData);
      romFile = new File([binary], data.romName || 'rom.' + currentSystem);
      await storeRomInIndexedDB(currentSystem, romFile.name, romFile);
    } catch(_) {}
  }

  // Fallback: try IndexedDB
  if (!romFile) {
    romFile = await loadRomFromIndexedDB(currentSystem, data.romName);
  }

  if (romFile) {
    saveStateData = data.state || null;
    const url = URL.createObjectURL(romFile);
    currentRomBlob = url;
    loadEmulator(currentSystem, url);
    setStatus('Loaded save', 'active');
  } else {
    setStatus('ROM not found in save. Re-upload it.', 'error');
  }
}

saveBtn.addEventListener('click', handleBridgeSave);
loadBtn.addEventListener('click', handleBridgeLoad);

// ─── Fullscreen ───
fsBtn.addEventListener('click', function() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
});

// ─── Bridge data functions ───
window.__gameSaveData = function() {
  try {
    return JSON.parse(localStorage.getItem(LS_SAVE_KEY + '-bridge') || 'null') || { system: currentSystem, romName: romName.textContent || '' };
  } catch(_) { return {}; }
};

window.__gameLoadData = function(data) {
  if (!data) return;
  if (data.system) { currentSystem = data.system; systemSelect.value = currentSystem; }
  if (data.romName) romName.textContent = data.romName;
  saveMeta();
};

// ─── Base64 helpers ───
function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ─── Boot ───
loadMeta();
updateControlsHint(currentSystem);
dropOverlay.classList.remove('hidden');

// Auto-restore last session
(async function boot() {
  // Try bridge load first
  let hasBridgeData = false;
  if (window.gameBridge) {
    try {
      const d = await window.gameBridge.load();
      if (d && d.romData && d.romName) {
        hasBridgeData = true;
        if (d.system) { currentSystem = d.system; systemSelect.value = currentSystem; updateControlsHint(currentSystem); }
        if (d.romName) romName.textContent = d.romName;
        saveStateData = d.state || null;
        try {
          const binary = base64ToArrayBuffer(d.romData);
          const romFile = new File([binary], d.romName);
          await storeRomInIndexedDB(currentSystem, romFile.name, romFile);
          const url = URL.createObjectURL(romFile);
          currentRomBlob = url;
          loadEmulator(currentSystem, url);
        } catch(_) { hasBridgeData = false; }
      }
    } catch(_) {}
  }

  // Fallback: load from IndexedDB
  if (!hasBridgeData && romName.textContent) {
    const romFile = await loadRomFromIndexedDB(currentSystem, romName.textContent);
    if (romFile) {
      const url = URL.createObjectURL(romFile);
      currentRomBlob = url;
      loadEmulator(currentSystem, url);
    } else {
      dropOverlay.classList.remove('hidden');
      setStatus('Load a ROM to start playing', '');
    }
  }

  if (!hasBridgeData && !romName.textContent) {
    setStatus('Load a ROM to start playing', '');
  }
})();
</script>
</body>
</html>
