<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canyon Runner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#c8c8c8}
canvas{display:block}
#hud{position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none;z-index:10}
#hud>div{display:inline-block;margin:0 14px;font-size:13px;color:rgba(255,255,255,0.4)}
#hud em{font-style:normal;font-weight:700;font-size:17px}
#hud .d{color:currentColor}
#hud .s{color:#dd8844}
#hud .c{color:#88ddff}
#hud .b{color:#44dd88}
#theme-name{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;letter-spacing:4px;pointer-events:none;opacity:0;transition:opacity.8s;z-index:10;text-shadow:0 0 30px rgba(255,255,255,0.2)}
#theme-name.show{opacity:1}
#powerup-bar{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none;z-index:10}
.pu-chip{padding:2px 10px;border-radius:10px;font-size:11px;background:rgba(0,0,0,0.6);border:1px solid;opacity:0;transition:opacity.3s}
.pu-chip.show{opacity:1}
#game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:20}
#game-over h1{font-size:32px;margin-bottom:4px;text-shadow:0 0 30px rgba(255,68,102,0.3)}
#game-over p{font-size:13px;color:rgba(255,255,255,0.4);margin:2px 0}
#game-over .big{font-size:24px;font-weight:700;color:#ffdd44}
#game-over .stat{font-size:13px;color:rgba(255,255,255,0.5)}
#game-over button{background:linear-gradient(135deg,#dd8844,#bb6622);border:none;color:#0a0a0a;padding:10px 28px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:12px;transition:all.2s}
#game-over button:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(221,136,68,0.3)}
#controls-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,0.12);pointer-events:none;z-index:5}
</style>
  <script src="../bridge.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>🏃 <em class="d" id="dist" style="color:#dd8844">0</em><span style="font-size:10px;color:rgba(200,200,200,0.2)">ft</span></div>
  <div>⭐ <em class="s" id="stars">0</em></div>
  <div>🔥 <em class="c" id="combo">0</em>x</div>
  <div>🏆 <em class="b" id="best">0</em></div>
</div>
<div id="powerup-bar"></div>
<div id="theme-name">FOREST</div>
<div id="game-over">
  <h1 style="color:#cc7733">SLIPPED</h1>
  <p class="big" id="final-dist">0ft</p>
  <p class="stat">⭐ <span id="final-stars">0</span> · Best combo: <span id="final-combo">0</span>x</p>
  <button id="restart-btn">RUN AGAIN</button>
</div>
<div id="controls-hint">SPACE / UP / TAP to jump · Collect gems for combos!</div>

<script>
// ─── Audio ───
let actx=null;
function ia(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t='sine',v=0.06){try{ia();let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxJump(){tn(350,0.1,'sine',0.08);setTimeout(()=>tn(500,0.06,'sine',0.05),50)}
function sfxStar(){tn(800,0.06);setTimeout(()=>tn(1000,0.06),40)}
function sfxCombo(){tn(880,0.08,'sine',0.07);setTimeout(()=>tn(1100,0.08,'sine',0.06),60)}
function sfxCrash(){tn(200,0.3,'sawtooth',0.1);setTimeout(()=>tn(120,0.4,'sawtooth',0.08),80)}
function sfxPowerup(){tn(600,0.08);setTimeout(()=>tn(800,0.08),60);setTimeout(()=>tn(1000,0.08),120)}
function sfxTheme(){tn(400,0.15);setTimeout(()=>tn(600,0.12),80);setTimeout(()=>tn(800,0.1),160)}

// ─── Canvas ───
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

// ─── Planet Themes ───
const THEMES=[
  {name:'RED CANYON',bg:['#1a0a05','#050200'],planet:['#5a2a10','#3a1a08','#1a0a02'],ground:'#cc7733',atmo:'rgba(200,100,40,0.06)'},
  {name:'PINE RIDGE',bg:['#0a1a10','#020a05'],planet:['#1a4a2a','#0d2a15','#051008'],ground:'#55bb66',atmo:'rgba(85,187,102,0.06)'},
  {name:'ARID MESA',bg:['#1a1008','#080500'],planet:['#4a3a1a','#2a200a','#151005'],ground:'#ccaa55',atmo:'rgba(200,170,85,0.06)'},
  {name:'MISTY GORGE',bg:['#0a1220','#050810'],planet:['#1a2a4a','#0a1530','#050820'],ground:'#6688cc',atmo:'rgba(102,136,204,0.06)'},
];

// ─── State ───
const state={
  player:{y:0,vy:0,groundY:0},
  obstacles:[],stars:[],powerups:[],particles:[],
  distance:0,starCount:0,highScore:0,
  speed:1,combo:0,maxCombo:0,comboTimer:0,
  gameOver:false,running:false,frame:0,
  theme:0,themeTransition:0,lastThemeChange:0,
  powerup:{magnet:0,shield:0,double:0},
};

// ─── DOM ───
const distEl=document.getElementById('dist');
const starsEl=document.getElementById('stars');
const comboEl=document.getElementById('combo');
const bestEl=document.getElementById('best');
const themeName=document.getElementById('theme-name');
const puBar=document.getElementById('powerup-bar');

// ─── Init ───
function initGame(){
  state.distance=0;state.starCount=0;
  state.speed=1;state.combo=0;state.maxCombo=0;state.comboTimer=0;
  state.gameOver=false;state.running=true;state.frame=0;
  state.theme=0;state.lastThemeChange=0;
  state.powerup={magnet:0,shield:0,double:0};
  state.obstacles=[];state.stars=[];state.powerups=[];state.particles=[];
  state.player.groundY=-H*0.65+20;
  state.player.y=state.player.groundY;state.player.vy=0;
  document.getElementById('game-over').style.display='none';
  updateThemeDisplay();
  updateHUD();
  updatePU();
}

// ─── Spawn ───
function spawnObstacle(){
  const types=['rock','crystal','spike','floating'];
  const type=types[Math.floor(Math.random()*types.length)];
  let w,h;
  if(type==='floating'){
    w=10+Math.random()*8;h=8+Math.random()*6;
  }else if(type==='rock'){w=18+Math.random()*14;h=18+Math.random()*14;}
  else if(type==='crystal'){w=12+Math.random()*10;h=22+Math.random()*16;}
  else{w=8+Math.random()*8;h=14+Math.random()*10;}
  
  const floatH=type==='floating'?-(10+Math.random()*25):0;
  state.obstacles.push({x:Math.PI*0.7,w,h,type,floatH,passed:false});
}

function spawnStar(){
  state.stars.push({
    x:Math.PI*0.7,yOffset:-15+Math.random()*35,
    collected:false,size:4+Math.random()*4,
  });
}

function spawnPowerup(){
  const types=['magnet','shield','double'];
  const t=types[Math.floor(Math.random()*types.length)];
  state.powerups.push({
    x:Math.PI*0.7,yOffset:-10+Math.random()*20,
    type:t,size:8,collected:false,
  });
}

// ─── Theme ───
function updateThemeDisplay(){
  const t=THEMES[state.theme];
  themeName.textContent=t.name;
  themeName.style.color=t.ground;
  themeName.className='show';
  clearTimeout(themeName._t);
  themeName._t=setTimeout(()=>themeName.className='',2000);
}

// ─── Update ───
function update(){
  if(!state.running||state.gameOver)return;
  state.frame++;
  
  // Theme change every 500m
  const newTheme=Math.min(Math.floor(state.distance/500),THEMES.length-1);
  if(newTheme!==state.theme){
    state.theme=newTheme;
    sfxTheme();
    updateThemeDisplay();
  }
  
  // Speed
  state.speed=1+state.distance*0.003;
  
  // Power-up timers
  for(const k of Object.keys(state.powerup)){
    if(state.powerup[k]>0)state.powerup[k]--;
  }
  updatePU();
  
  // Combo timer
  if(state.comboTimer>0){state.comboTimer--;if(state.comboTimer===0){state.combo=0;updateHUD();}}
  
  // Player physics
  state.player.vy-=0.38;
  state.player.y+=state.player.vy;
  if(state.player.y>state.player.groundY){
    state.player.y=state.player.groundY;
    state.player.vy=0;
  }
  
  const scrollSpeed=0.014*state.speed;
  
  // Move obstacles
  for(let i=state.obstacles.length-1;i>=0;i--){
    state.obstacles[i].x-=scrollSpeed;
    if(state.obstacles[i].x<-0.3){state.obstacles.splice(i,1);continue;}
  }
  
  // Move stars
  for(let i=state.stars.length-1;i>=0;i--){
    state.stars[i].x-=scrollSpeed;
    if(state.stars[i].x<-0.3){state.stars.splice(i,1);continue;}
  }
  
  // Move powerups
  for(let i=state.powerups.length-1;i>=0;i--){
    state.powerups[i].x-=scrollSpeed;
    if(state.powerups[i].x<-0.3){state.powerups.splice(i,1);continue;}
  }
  
  // Collision with obstacles
  const px=0;
  for(const ob of state.obstacles){
    const dx=Math.abs(px-ob.x);
    if(dx<0.045){
      const obsTop=state.player.groundY-ob.h+ob.floatH;
      if(state.player.y>obsTop-12){
        if(state.powerup.shield>0){
          state.powerup.shield=0;
          emitParticles(0,state.player.y,20,'#44ddff',4);
          state.obstacles=state.obstacles.filter(o=>o!==ob);
          sfxPowerup();
          continue;
        }
        crash();return;
      }
    }
  }
  
  // Star collection with magnet
  const magnetRange=state.powerup.magnet>0?0.15:0.05;
  for(const st of state.stars){
    if(st.collected)continue;
    const dx=Math.abs(px-st.x);
    if(dx<magnetRange){
      const plY=state.player.y;
      const starY=state.player.groundY+st.yOffset;
      if(Math.abs(plY-starY)<(state.powerup.magnet>0?50:25)){
        st.collected=true;
        const points=state.powerup.double>0?2:1;
        state.starCount+=points;
        state.combo++;
        state.comboTimer=40;
        if(state.combo>state.maxCombo)state.maxCombo=state.combo;
        emitParticles(Math.cos(0)*(H*0.65),Math.sin(0)*(H*0.65)+starY,6,'#ffdd44',2);
        
        if(state.combo>1&&state.combo%3===0)sfxCombo();else sfxStar();
      }
    }
  }
  
  // Powerup collection
  for(const pu of state.powerups){
    if(pu.collected)continue;
    const dx=Math.abs(px-pu.x);
    if(dx<0.05){
      const plY=state.player.y;
      const puY=state.player.groundY+pu.yOffset;
      if(Math.abs(plY-puY)<25){
        pu.collected=true;
        state.powerup[pu.type]=300;
        sfxPowerup();
        emitParticles(Math.cos(0)*(H*0.65),Math.sin(0)*(H*0.65)+puY,12,pu.type==='magnet'?'#44ddff':pu.type==='shield'?'#44ff88':'#ffdd44',3);
      }
    }
  }
  
  // Distance
  state.distance+=state.speed*0.18;
  
  // Spawn
  const spawnRate=Math.max(25,70-state.distance*0.08);
  if(state.frame%Math.floor(spawnRate)===0)spawnObstacle();
  if(state.frame%Math.floor(spawnRate*0.5)===0)spawnStar();
  if(state.frame%400===0)spawnPowerup();
  
  updateParticles();
  updateHUD();
}

function crash(){
  state.gameOver=true;
  sfxCrash();
  emitParticles(Math.cos(0)*(H*0.65),Math.sin(0)*(H*0.65)+state.player.y,40,'#ff4466',6);
  document.getElementById('final-dist').textContent=Math.floor(state.distance)+'ft';
  document.getElementById('final-stars').textContent=state.starCount;
  document.getElementById('final-combo').textContent=state.maxCombo;
  document.getElementById('game-over').style.display='block';
  if(state.distance>state.highScore){
    state.highScore=Math.floor(state.distance);
    bestEl.textContent=state.highScore;
    if(window.gameBridge)window.gameBridge.save({highScore:state.highScore}).catch(()=>{});
  }
}

function emitParticles(x,y,count,color,speed=3){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=0.5+Math.random()*speed;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*15,maxLife:35,color,size:1.5+Math.random()*2});
  }
}

function updateParticles(){
  for(let i=state.particles.length-1;i>=0;i--){
    const p=state.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;
    p.life--;
    if(p.life<=0)state.particles.splice(i,1);
  }
}

function updateHUD(){
  distEl.textContent=Math.floor(state.distance);
  starsEl.textContent=state.starCount;
  comboEl.textContent=state.combo;
  bestEl.textContent=state.highScore;
  
  // Color combo based on multiplier
  if(state.combo>=10)comboEl.style.color='#cc6644';
  else if(state.combo>=5)comboEl.style.color='#ccaa44';
  else if(state.combo>=3)comboEl.style.color='#88cc66';
  else comboEl.style.color='#88ddff';
}

function updatePU(){
  puBar.innerHTML='';
  const names={magnet:'🧲 Magnet',shield:'🛡️ Shield',double:'✖2 Score'};
  for(const [k,v] of Object.entries(state.powerup)){
    if(v>0){
      const el=document.createElement('span');
      el.className='pu-chip show';
      el.style.borderColor=k==='magnet'?'#44ddff':k==='shield'?'#44ff88':'#ffdd44';
      el.textContent=names[k]+' '+(v/60|0)+'s';
      puBar.appendChild(el);
    }
  }
}

// ─── Jump ───
function jump(){
  if(!state.running||state.gameOver)return;
  if(state.player.y<state.player.groundY-2)return;
  state.player.vy=7.5;
  sfxJump();
}

// ─── Draw ───
function draw(){
  const t=THEMES[state.theme];
  ctx.clearRect(0,0,W,H);
  
  // Background
  const grad=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,H);
  grad.addColorStop(0,t.ground+'15');grad.addColorStop(0.5,t.bg[0]);grad.addColorStop(1,t.bg[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  
  // Clouds floating
  for(let i=0;i<8;i++){
    const cx=(i*W/7+state.distance*0.02*(i%2?1:-1)*0.3+state.frame*0.05*i)%W;
    const cy=20+i*25+Math.sin(i*2.3+state.distance*0.01)*10;
    ctx.fillStyle=`rgba(200,200,200,${0.02+i*0.006})`;
    ctx.beginPath();
    ctx.ellipse(cx,cy,40+i*15,6+i*2,0,0,Math.PI*2);
    ctx.fill();
  }
  
  const p={cx:W/2,cy:H*1.25,r:H*0.65};
  
  ctx.save();
  ctx.translate(p.cx,p.cy);
  
  // Planet body
  const bg=ctx.createRadialGradient(0,0,p.r*0.3,0,0,p.r);
  bg.addColorStop(0,t.planet[0]);bg.addColorStop(0.5,t.planet[1]);bg.addColorStop(1,t.planet[2]);
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
  
  // Atmosphere
  const atmo=ctx.createRadialGradient(0,-p.r*0.8,p.r*0.1,0,-p.r*0.7,p.r*0.4);
  atmo.addColorStop(0,t.atmo);atmo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=atmo;
  ctx.beginPath();ctx.arc(0,0,p.r*1.05,0,Math.PI*2);ctx.fill();
  
  // Ground ring
  ctx.strokeStyle=t.ground+'22';
  ctx.lineWidth=2;ctx.setLineDash([6,10]);
  ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  
  // Surface details
  for(let i=0;i<25;i++){
    const a=(i/25)*Math.PI*2;
    const cr=p.r+3+Math.sin(i*4.7)*4;
    ctx.fillStyle=t.ground+`${10+Math.sin(i*2.3)*8})`;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*cr,Math.sin(a)*cr,1.5+Math.sin(i*1.7)*1.5,0,Math.PI*2);
    ctx.fill();
  }
  
  // Stars
  for(const st of state.stars){
    if(st.collected)continue;
    const a=st.x;
    const sx=Math.cos(a)*(p.r+st.yOffset);
    const sy=Math.sin(a)*(p.r+st.yOffset);
    ctx.fillStyle='#ffdd44';ctx.shadowColor='#ffdd44';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(sx,sy,st.size,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(sx,sy,st.size*0.3,0,Math.PI*2);ctx.fill();
  }
  
  // Powerups
  for(const pu of state.powerups){
    if(pu.collected)continue;
    const a=pu.x;
    const sx=Math.cos(a)*(p.r+pu.yOffset);
    const sy=Math.sin(a)*(p.r+pu.yOffset);
    const pulse=Math.sin(state.frame*0.06)*0.2+0.8;
    const color=pu.type==='magnet'?'#44ddff':pu.type==='shield'?'#44ff88':'#ffdd44';
    ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(sx,sy,pu.size*pulse,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';
    ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const icons={magnet:'🧲',shield:'🛡',double:'✖'};
    ctx.fillText(icons[pu.type]||'?',sx,sy+1);
  }
  ctx.shadowBlur=0;
  
  // Obstacles
  for(const ob of state.obstacles){
    const a=ob.x;
    const ox=Math.cos(a)*p.r;
    const oy=Math.sin(a)*p.r;
    ctx.save();ctx.translate(ox,oy);ctx.rotate(a+Math.PI/2);
    
    const c=t.ground==='#00ffaa'?'#554433':t.ground==='#ff6644'?'#663322':t.ground==='#44ddff'?'#335566':'#553366';
    const c2=t.ground==='#00ffaa'?'#776655':t.ground==='#ff6644'?'#885544':t.ground==='#44ddff'?'#558899':'#774488';
    
    if(ob.type==='rock'){
      ctx.fillStyle=c;ctx.strokeStyle=c2;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(-ob.w/2,0);ctx.lineTo(-ob.w/2-3,-ob.h);
      ctx.lineTo(0,-ob.h-5);ctx.lineTo(ob.w/2+3,-ob.h);
      ctx.lineTo(ob.w/2,0);ctx.closePath();ctx.fill();ctx.stroke();
    }else if(ob.type==='crystal'){
      ctx.fillStyle='#44aaff';ctx.shadowColor='#44aaff';ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(0,ob.floatH);
      ctx.lineTo(-ob.w/2,-ob.h*0.6+ob.floatH);
      ctx.lineTo(0,-ob.h+ob.floatH);
      ctx.lineTo(ob.w/2,-ob.h*0.6+ob.floatH);
      ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    }else if(ob.type==='spike'){
      ctx.fillStyle='#ff4466';
      ctx.beginPath();ctx.moveTo(0,ob.floatH);
      ctx.lineTo(-ob.w/2,-ob.h+ob.floatH);
      ctx.lineTo(ob.w/2,-ob.h+ob.floatH);
      ctx.closePath();ctx.fill();
    }else{
      // Floating
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.shadowColor='rgba(255,255,255,0.2)';ctx.shadowBlur=5;
      ctx.beginPath();ctx.arc(0,ob.floatH,ob.w/2,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }
  
  // Player
  const px=Math.cos(0)*p.r;
  const py2=Math.sin(0)*p.r+state.player.y;
  ctx.save();ctx.translate(px,py2);
  
  ctx.shadowColor=t.ground;ctx.shadowBlur=15;
  ctx.fillStyle=t.ground;
  ctx.beginPath();ctx.arc(0,-8,9,0,Math.PI*2);ctx.fill();
  
  // Trail
  ctx.shadowBlur=0;
  ctx.strokeStyle=t.ground+'44';ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=1;i<8;i++){
    const ti=state.frame*0.15+i*0.5;
    const tx=-i*5+Math.sin(ti)*3;
    const ty=3+Math.abs(Math.sin(ti))*5;
    if(i===1)ctx.moveTo(tx,ty);else ctx.lineTo(tx,ty);
  }
  ctx.stroke();
  
  // Shield glow
  if(state.powerup.shield>0){
    ctx.strokeStyle=`rgba(68,255,136,${0.3+Math.sin(state.frame*0.1)*0.2})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-8,14,0,Math.PI*2);ctx.stroke();
  }
  
  ctx.restore();
  
  // Speed lines
  if(state.speed>2.5){
    ctx.strokeStyle=`rgba(255,255,255,${(state.speed-2.5)*0.03})`;
    ctx.lineWidth=1;
    for(let i=0;i<15;i++){
      const lx=Math.random()*W,ly=Math.random()*H,ll=10+Math.random()*30;
      ctx.globalAlpha=0.05+Math.random()*0.1;
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx+ll,ly);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  
  // Particles
  for(const p of state.particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  
  ctx.restore();
}

// ─── Loop ───
function loop(){update();draw();requestAnimationFrame(loop);}

// ─── Controls ───
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump();}
});
canvas.addEventListener('click',jump);
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump()});
document.getElementById('restart-btn').addEventListener('click',initGame);

// ─── Save/Load ───
async function loadBest(){
  if(!window.gameBridge)return;
  try{const d=await window.gameBridge.load();if(d&&d.highScore)state.highScore=d.highScore;}catch(e){}
  bestEl.textContent=state.highScore;
}
window.__gameSaveData=()=>({highScore:state.highScore});
window.__gameLoadData=(d)=>{if(d&&d.highScore){state.highScore=d.highScore;bestEl.textContent=state.highScore;}};

loadBest();
initGame();
loop();
</script>
