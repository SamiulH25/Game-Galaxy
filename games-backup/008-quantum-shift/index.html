body{background:linear-gradient(135deg,#0a0e0a,#101a10,#0a0e0a);font-family:'Segoe UI',sans-serif;color:#c8d8c8;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
#game{width:100%;max-width:500px;padding:16px;text-align:center}
h1{font-size:20px;font-weight:300;letter-spacing:3px}
h1 span{color:#66dd88;font-weight:700}
#level-top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px}
#level-select{background:rgba(102,221,136,0.08);border:1px solid rgba(102,221,136,0.15);color:#c8d8c8;padding:5px 12px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
#level-select option{background:#0a1a0a;color:#c8d8c8}
#dimension-indicator{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(200,216,200,0.4)}

#game-canvas{width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;display:block;border-radius:12px;cursor:pointer;background:rgba(200,216,200,0.02);border:2px solid rgba(102,221,136,0.1)}
#controls{display:flex;gap:18px;justify-content:center;margin:10px 0 6px}
.ctrl-btn{width:56px;height:56px;border-radius:12px;background:rgba(102,221,136,0.06);border:1px solid rgba(102,221,136,0.1);color:#c8d8c8;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all.15s;user-select:none}
.ctrl-btn:active{transform:scale(0.9);background:rgba(102,221,136,0.15)}
#shift-btn{background:linear-gradient(135deg,#66dd88,#4488cc);border:none;color:#0a0e0a;padding:8px 24px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all.2s;display:flex;align-items:center;gap:6px;margin:0 auto}
#shift-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(102,221,136,0.3)}
#shift-btn .icon{font-size:18px}
#status{font-size:13px;min-height:20px;margin-top:6px;color:rgba(200,216,200,0.4)}
#status.win{color:#66dd88}
#status.lose{color:#dd6677}
#moves-display{font-size:11px;color:rgba(200,216,200,0.2);margin-top:4px}
</style>

<div id="game">
<h1>✦ <span>Phase</span> Shift</h1>

  <div id="dimension-indicator">Phase: <span id="dim-name">Alpha</span> <span id="dim-dot" style="background:#66dd88"></span></div>

<canvas id="game-canvas"></canvas>
<div id="controls">
  <button class="ctrl-btn" data-dir="up">↑</button>
  <button class="ctrl-btn" data-dir="left">←</button>
  <button class="ctrl-btn" data-dir="down">↓</button>

// ─── Audio ───
let actx=null;
function ia(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t='sine',v=0.06){try{ia();let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxMove(){tn(400,0.06,'sine',0.05)}
function sfxShift(){tn(600,0.1,'sine',0.06);setTimeout(()=>tn(800,0.08,'sine',0.04),80)}
function sfxWin(){[0,100,200,300].forEach((d,i)=>setTimeout(()=>tn(440+i*160,0.2,'sine',0.08),d))}
function sfxBlock(){tn(200,0.15,'sawtooth',0.04)}

// ─── State ───
let level=0,dim='A',player={r:0,c:0},exit={r:0,c:0},grid=[],moves=0,won=false,completed={};

const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const select=document.getElementById('level-select');
const dimName=document.getElementById('dim-name');
const dimDot=document.getElementById('dim-dot');
const statusEl=document.getElementById('status');
const movesEl=document.getElementById('moves-count');

// ─── Load Level ───
function loadLevel(idx){
  level=idx;
  const lv=LEVELS[idx];
  grid=lv.grid.map(r=>[...r]);
  dim='A';
  moves=0;won=false;
  movesEl.textContent='0';
  statusEl.className='';
  statusEl.textContent='Navigate the particle to the exit ⬟';
  
  // Find player and exit
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<grid[0].length;c++){
      if(grid[r][c]===4){player={r,c};grid[r][c]=0;}
      if(grid[r][c]===5){exit={r,c};grid[r][c]=0;}
    }
  }
  
  updateDimUI();
  render();
}

// ─── Dimension UI ───
function updateDimUI(){
  if(dim==='A'){
    dimName.textContent='A';
    dimDot.style.background='#66dd88';
  }else{
    dimName.textContent='B';
    dimDot.style.background='#ddaa44';
  }
}

// ─── Move ───
function move(dr,dc){
  if(won)return;
  const nr=player.r+dr,nc=player.c+dc;
  if(nr<0||nr>=grid.length||nc<0||nc>=grid[0].length)return;
  
  const cell=grid[nr][nc];
  // Check if blocked in current dimension
  if((dim==='A'&&(cell===1||cell===3))||(dim==='B'&&(cell===2||cell===3))){
    sfxBlock();
    statusEl.className='lose';
    statusEl.textContent='Blocked in this phase! Toggle to get through.';
    return;
  }
  
  player={r:nr,c:nc};
  moves++;
  movesEl.textContent=moves;
  sfxMove();
  statusEl.className='';
  statusEl.textContent='';
  
  render();
  
  if(player.r===exit.r&&player.c===exit.c){
    won=true;
    sfxWin();
    statusEl.className='win';
    statusEl.textContent=`Level ${level+1} Complete! ${moves} moves.`;
    
    if(!completed[level]||moves<completed[level]){
      completed[level]=moves;
      if(window.gameBridge)window.gameBridge.save({completed}).catch(()=>{});
    }
    
    // Auto-advance after delay
    setTimeout(()=>{
      if(level<LEVELS.length-1){
        loadLevel(level+1);
        select.value=level;
      }
    },1500);
  }
}

// ─── Shift ───
function shiftDim(){
  if(won)return;
  dim=dim==='A'?'B':'A';
  sfxShift();
  updateDimUI();
  statusEl.className='';
  statusEl.textContent=`Toggled to Phase ${dim}`;
  render();
}

// ─── Render ───
function render(){
  const rect=canvas.parentElement.getBoundingClientRect();
  const size=Math.min(rect.width,400);
  const dpr=window.devicePixelRatio||1;
  canvas.style.width=size+'px';
  canvas.style.height=size+'px';
  canvas.width=size*dpr;
  canvas.height=size*dpr;
  ctx.scale(dpr,dpr);
  
  const rows=grid.length,cols=grid[0].length;
  const cell=size/Math.max(rows,cols);
  const offX=(size-cols*cell)/2;
  const offY=(size-rows*cell)/2;
  
  // Background
  ctx.fillStyle='rgba(0,8,20,0.5)';
  ctx.fillRect(0,0,size,size);
  
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=offX+c*cell,y=offY+r*cell;
      const val=grid[r][c];
      
      // Cell background
      ctx.fillStyle='rgba(255,255,255,0.02)';
      ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle='rgba(255,255,255,0.04)';
      ctx.lineWidth=0.5;
      ctx.strokeRect(x,y,cell,cell);
      
      // Walls
      if(val===1||val===3){
        if(dim==='A'||val===3){
          ctx.fillStyle=val===3?'rgba(102,221,136,0.2)':'rgba(102,221,136,0.3)';
          ctx.fillRect(x+2,y+2,cell-4,cell-4);
          ctx.fillStyle='rgba(102,221,136,0.5)';
          ctx.font=`${cell*0.15}px sans-serif`;
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('▦',x+cell/2,y+cell/2);
        }
      }
      if(val===2||val===3){
        if(dim==='B'||val===3){
          ctx.fillStyle=val===3?'rgba(221,170,68,0.2)':'rgba(221,170,68,0.3)';
          ctx.fillRect(x+2,y+2,cell-4,cell-4);
          ctx.fillStyle='rgba(221,170,68,0.5)';
          ctx.font=`${cell*0.15}px sans-serif`;
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('▤',x+cell/2,y+cell/2);
        }
      }
    }
  }
  
  // Exit
  const ex=offX+exit.c*cell,ey=offY+exit.r*cell;
  ctx.fillStyle='#44ff88';
  ctx.shadowColor='#44ff88';
  ctx.shadowBlur=15;
  ctx.font=`${cell*0.35}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('⬟',ex+cell/2,ey+cell/2);
  ctx.shadowBlur=0;
  
  // Player
  const px=offX+player.c*cell,py=offY+player.r*cell;
  const grad=ctx.createRadialGradient(px+cell/2,py+cell/2,0,px+cell/2,py+cell/2,cell*0.4);
  if(dim==='A'){
    grad.addColorStop(0,'rgba(102,221,136,0.9)');
    grad.addColorStop(1,'rgba(102,221,136,0.1)');
  }else{
    grad.addColorStop(0,'rgba(221,170,68,0.9)');
    grad.addColorStop(1,'rgba(221,170,68,0.1)');
  }
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(px+cell/2,py+cell/2,cell*0.3,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(px+cell/2,py+cell/2,cell*0.1,0,Math.PI*2);
  ctx.fill();
}

// ─── Controls ───
document.querySelectorAll('.ctrl-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const d=btn.dataset.dir;
    if(d==='up')move(-1,0);
    else if(d==='down')move(1,0);
    else if(d==='left')move(0,-1);
    else if(d==='right')move(0,1);
  });
});

document.getElementById('shift-btn').addEventListener('click',shiftDim);

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){e.preventDefault();move(-1,0);}
  else if(e.key==='ArrowDown'){e.preventDefault();move(1,0);}
  else if(e.key==='ArrowLeft'){e.preventDefault();move(0,-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();move(0,1);}
  else if(e.key===' '||e.key==='Shift'){e.preventDefault();shiftDim();}
});

// Level select
LEVELS.forEach((lv,i)=>{
  const opt=document.createElement('option');
  opt.value=i;
  opt.textContent=`${i+1}. ${lv.name}`;
  select.appendChild(opt);
});
select.addEventListener('change',()=>loadLevel(parseInt(select.value)));

window.addEventListener('resize',render);

// ─── Save/Load ───
async function loadProgress(){
  if(!window.gameBridge)return;
  try{
    const d=await window.gameBridge.load();
    if(d&&d.completed)completed=d.completed;
  }catch(e){}
  
  // Find first incomplete level
  for(let i=0;i<LEVELS.length;i++){
    if(!completed[i]){
      loadLevel(i);
      select.value=i;
      return;
    }
  }
  loadLevel(LEVELS.length-1);
  select.value=LEVELS.length-1;
}

window.__gameSaveData=()=>({completed});
window.__gameLoadData=(d)=>{if(d&&d.completed)completed=d.completed};

loadProgress();
</script>
