<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Clicker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0a0e12,#0f1a15,#0a1210);font-family:'Segoe UI',sans-serif;color:#c8e0d8;min-height:100vh;display:flex;justify-content:center;align-items:center;user-select:none;overflow:hidden}
#game{text-align:center;width:100%;max-width:420px;padding:16px;position:relative}
h1{font-size:24px;font-weight:300;letter-spacing:4px;text-transform:uppercase}
h1 span{color:#44dd88;font-weight:700}
#energy{font-size:40px;font-weight:700;margin:6px 0 2px}
#energy span{color:#44dd88}
#rate{font-size:14px;color:rgba(200,224,216,0.4);margin-bottom:10px}
#orb-container{position:relative;width:180px;height:180px;margin:8px auto}
#orb{width:100%;height:100%;border-radius:30% 70% 50% 50% / 30% 40% 60% 70%;cursor:pointer;position:relative;transition:transform.1s;z-index:2}
#orb:active{transform:scale(0.92)}
#orb-ring{position:absolute;top:-8px;left:-8px;width:calc(100%+16px);height:calc(100%+16px);border-radius:50%;border:2px solid rgba(68,221,136,0.15);z-index:1;transition:all.3s}
#upgrades{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.upg{background:rgba(68,221,136,0.06);border:1px solid rgba(68,221,136,0.12);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;transition:all.2s}
.upg:hover{background:rgba(68,221,136,0.1)}
.upg:disabled{opacity:0.35;cursor:not-allowed}
.upg .un{font-size:12px;font-weight:600}
.upg .ul{font-size:10px;color:rgba(200,224,216,0.3)}
.upg .uc{font-size:10px;color:#44dd88}
.upg .ud{font-size:9px;color:rgba(200,224,216,0.2);margin-top:2px}
#milestones{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.ms{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(200,224,216,0.03);border:1px solid rgba(200,224,216,0.05);color:rgba(200,224,216,0.2)}
.ms.unlocked{background:rgba(68,221,136,0.1);border-color:rgba(68,221,136,0.2);color:#44dd88}
#stats-bar{display:flex;justify-content:center;gap:14px;font-size:11px;color:rgba(200,224,216,0.2);margin-top:8px}
#status-text{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(200,224,216,0.3);transition:all.3s;padding:6px 14px;border-radius:20px;background:rgba(200,224,216,0.03);border:1px solid rgba(200,224,216,0.05)}
#status-text.saving{color:#44dd88;border-color:rgba(68,221,136,0.3)}
#status-text.saved{color:#44dd88;border-color:rgba(68,221,136,0.3)}
</style>
  <script src="../bridge.js"></script>
</head>
<body>
<div id="game">
<h1>✦ <span>Crystal</span> Clicker</h1>
<div id="energy">💎<span id="count">0</span></div>
<div id="rate">+<span id="rate-val">0</span>/s · <span id="click-val">1</span> per click</div>
<div id="orb-container">
  <div id="orb" style="background:linear-gradient(135deg,#66eeaa,#22aa66 40%,#0a3a22);box-shadow:0 0 60px rgba(68,221,136,0.4),inset 0 0 40px rgba(68,221,136,0.15)"></div>
  <div id="orb-ring"></div>
</div>
<div id="upgrades"></div>
<div id="milestones"></div>
<div id="stats-bar"><span>Total Clicks: <span id="total-clicks">0</span></span><span>Peak Rate: <span id="peak-rate">0</span>/s</span></div>
<div id="status-text">Mine the crystal!</div>
</div>
<script>
// ─── Audio ───
let actx=null;
function ia(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t='sine',v=0.05){try{ia();let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxClick(){tn(600,0.05,'sine',0.06)}
function sfxBuy(){tn(500,0.08);setTimeout(()=>tn(700,0.08),60)}
function sfxMs(){tn(600,0.1);setTimeout(()=>tn(800,0.08),80);setTimeout(()=>tn(1000,0.08),160)}

// ─── Upgrades ───
const UPGRADES=[
  {id:'click',name:'💎 Pickaxe',desc:'+1 per swing',base:10,mul:1.15,max:20,key:'clickLv',fn:s=>s.clickPower++},
  {id:'auto',name:'🔨 Mine Cart',desc:'+0.5/s',base:25,mul:1.2,max:20,key:'autoLv',fn:s=>{s.autoRate+=0.5}},
  {id:'mult',name:'⚡ Refinery',desc:'×1.2 all yield',base:60,mul:1.3,max:12,key:'multLv',fn:s=>{}},
  {id:'clicker',name:'🤖 Prospector',desc:'1 swing/s',base:150,mul:1.35,max:10,key:'clickerLv',fn:s=>{}},
  {id:'crit',name:'💫 Lucky Strike',desc:'+2% double yield',base:300,mul:1.4,max:10,key:'critLv',fn:s=>{}},
];

const MILESTONES=[
  {thresh:100,label:'⭐ Pebble',icon:'🪨'},
  {thresh:500,label:'⭐ Shard',icon:'💎'},
  {thresh:2000,label:'⭐ Geode',icon:'🔮'},
  {thresh:10000,label:'⭐ Crystal',icon:'💠'},
  {thresh:50000,label:'⭐ Gem Vein',icon:'✨'},
  {thresh:200000,label:'⭐ Motherlode',icon:'👑'},
];

// ─── State ───
const state={
  energy:0,clickPower:1,autoRate:0,
  clickLv:0,autoLv:0,multLv:0,clickerLv:0,critLv:0,
  totalClicks:0,peakRate:0,
};
let sf=state;

function getCost(u){return Math.floor(u.base*Math.pow(u.mul,sf[u.key]));}
function getMult(){return 1+sf.multLv*0.2;}
function getCrit(){return sf.critLv*2;}
function getClickerRate(){return sf.clickerLv;}

// ─── DOM ───
const countEl=document.getElementById('count');
const rateEl=document.getElementById('rate-val');
const clickEl=document.getElementById('click-val');
const orb=document.getElementById('orb');
const orbRing=document.getElementById('orb-ring');
const upgradesEl=document.getElementById('upgrades');
const milestonesEl=document.getElementById('milestones');
const totalClicksEl=document.getElementById('total-clicks');
const peakRateEl=document.getElementById('peak-rate');
const statusEl=document.getElementById('status-text');

// ─── Orb Click ───
orb.addEventListener('click',e=>{
  const base=sf.clickPower*getMult();
  const isCrit=Math.random()*100<getCrit();
  const gained=isCrit?Math.ceil(base*2):Math.ceil(base);
  sf.energy+=gained;
  sf.totalClicks++;
  
  sfxClick();
  
  // Float number
  const fx=document.createElement('div');
  fx.style.cssText=`position:fixed;pointer-events:none;font-size:${isCrit?28:20}px;font-weight:700;color:${isCrit?'#ffdd66':'#44dd88'};text-shadow:0 0 20px rgba(68,221,136,0.6);animation:floatUp 0.8s ease-out forwards;z-index:100`;
  fx.textContent=isCrit?'LUCKY! +'+gained:'+'+gained;
  fx.style.left=(e.clientX-30)+'px';fx.style.top=(e.clientY-20)+'px';
  document.body.appendChild(fx);
  setTimeout(()=>fx.remove(),800);
  
  // Orb pulse
  orb.style.transform='scale(0.92)';
  setTimeout(()=>orb.style.transform='scale(1)',100);
  
  updateUI();
  autoSave();
});

// ─── Inject float keyframe ───
const style=document.createElement('style');
style.textContent=`@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.5)}}`;
document.head.appendChild(style);

// ─── Render Upgrades ───
function renderUpgrades(){
  upgradesEl.innerHTML='';
  UPGRADES.forEach(u=>{
    const cost=getCost(u);
    const lv=sf[u.key];
    const maxed=lv>=u.max;
    const el=document.createElement('div');
    el.className='upg';
    el.innerHTML=`<div class="un">${u.name} <span class="ul">Lv.${lv}/${u.max}</span></div><div class="uc">${maxed?'MAX':`⚡${cost}`}</div><div class="ud">${u.desc}</div>`;
    el.disabled=sf.energy<cost||maxed;
    if(maxed)el.style.opacity='0.4';
    el.addEventListener('click',()=>{
      if(sf.energy<cost||maxed)return;
      sf.energy-=cost;
      u.fn(sf);
      sf[u.key]++;
      sfxBuy();
      autoSave();
      updateUI();
    });
    upgradesEl.appendChild(el);
  });
}

// ─── Milestones ───
function renderMilestones(){
  milestonesEl.innerHTML='';
  MILESTONES.forEach(m=>{
    const unlocked=sf.energy>=m.thresh;
    const el=document.createElement('span');
    el.className='ms'+(unlocked?' unlocked':'');
    el.textContent=`${m.icon} ${m.label}`;
    if(!unlocked)el.textContent+=` (${m.thresh})`;
    milestonesEl.appendChild(el);
  });
}

// ─── Auto Income ───
setInterval(()=>{
  sf.energy+=sf.autoRate*getMult()/20;
  if(sf.autoRate>sf.peakRate)sf.peakRate=sf.autoRate;
  updateUI();
},50);

setInterval(()=>{
  const rate=getClickerRate();
  if(rate>0){
    sf.energy+=sf.clickPower*getMult()*rate;
    sf.totalClicks+=rate;
    updateUI();
  }
},1000);

// ─── Orb Evolution ───
function updateOrb(){
  const pct=Math.min(1,sf.energy/100000);
  const hue=150-pct*40;
  const sat=70+pct*20;
  const bri=50+pct*30;
  const size=1+pct*0.15;
  orb.style.background=`linear-gradient(135deg,hsl(${hue+30},100%,${bri+20}%),hsl(${hue},${sat}%,${bri}%) 50%,hsl(${hue-15},${sat}%,${bri*0.3}%))`;
  orb.style.boxShadow=`0 0 ${40+pct*80}px hsla(${hue},100%,60%,${0.3+pct*0.4})`;
  orb.style.transform=`scale(${size})`;
  orbRing.style.borderColor=`hsla(${hue},100%,60%,${0.1+pct*0.3})`;
  orbRing.style.transform=`rotate(${sf.totalClicks}deg)`;
}

// ─── UI ───
function updateUI(){
  countEl.textContent=Math.floor(sf.energy);
  rateEl.textContent=(sf.autoRate*getMult()).toFixed(1);
  clickEl.textContent=Math.ceil(sf.clickPower*getMult())+(getCrit()>0?` (${getCrit()}% crit)`:'');
  totalClicksEl.textContent=sf.totalClicks;
  peakRateEl.textContent=sf.peakRate.toFixed(1);
  renderUpgrades();
  renderMilestones();
  updateOrb();
}

// ─── Save/Load ───
function autoSave(){
  if(!window.gameBridge)return;
  clearTimeout(window.__st);
  window.__st=setTimeout(()=>{
    statusEl.textContent='Saving...';statusEl.className='saving';
    window.gameBridge.save({
      energy:sf.energy,clickPower:sf.clickPower,autoRate:sf.autoRate,
      clickLv:sf.clickLv,autoLv:sf.autoLv,multLv:sf.multLv,
      clickerLv:sf.clickerLv,critLv:sf.critLv,
      totalClicks:sf.totalClicks,peakRate:sf.peakRate,
    }).then(()=>{
      statusEl.textContent='Saved!';statusEl.className='saved';
      setTimeout(()=>{statusEl.textContent='Click the orb!';statusEl.className='';},1500);
    }).catch(()=>{});
  },500);
}

async function loadGame(){
  if(!window.gameBridge)return;
  statusEl.textContent='Loading...';statusEl.className='saving';
  try{
    const d=await window.gameBridge.load();
    if(d){
      sf.energy=d.energy||0;sf.clickPower=d.clickPower||1;sf.autoRate=d.autoRate||0;
      sf.clickLv=d.clickLv||0;sf.autoLv=d.autoLv||0;sf.multLv=d.multLv||0;
      sf.clickerLv=d.clickerLv||0;sf.critLv=d.critLv||0;
      sf.totalClicks=d.totalClicks||0;sf.peakRate=d.peakRate||0;
      statusEl.textContent='Progress restored!';
    }else statusEl.textContent='Start fresh!';
  }catch(e){statusEl.textContent='Load failed.';}
  statusEl.className='';
  updateUI();
}

window.__gameSaveData=()=>({
  energy:sf.energy,clickPower:sf.clickPower,autoRate:sf.autoRate,
  clickLv:sf.clickLv,autoLv:sf.autoLv,multLv:sf.multLv,
  clickerLv:sf.clickerLv,critLv:sf.critLv,
  totalClicks:sf.totalClicks,peakRate:sf.peakRate,
});
window.__gameLoadData=(d)=>{if(!d)return;
  sf.energy=d.energy||0;sf.clickPower=d.clickPower||1;sf.autoRate=d.autoRate||0;
  sf.clickLv=d.clickLv||0;sf.autoLv=d.autoLv||0;sf.multLv=d.multLv||0;
  sf.clickerLv=d.clickerLv||0;sf.critLv=d.critLv||0;
  sf.totalClicks=d.totalClicks||0;sf.peakRate=d.peakRate||0;
  updateUI();statusEl.textContent='Loaded!';statusEl.className='saved';setTimeout(()=>{statusEl.textContent='Click the orb!';statusEl.className='';},1500);
};

loadGame();
updateUI();
</script>
</body>
</html>
