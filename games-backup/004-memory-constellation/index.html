<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Meadow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #0a1a10 0%, #142818 50%, #0a1a10 100%);
    font-family: 'Segoe UI', sans-serif; color: #c8e0d0; min-height: 100vh;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  #game { width: 100%; max-width: 640px; padding: 20px; text-align: center; }
  h1 { font-size: 22px; font-weight: 300; letter-spacing: 3px; margin-bottom: 4px; }
  h1 span { color: #66dd88; font-weight: 700; }
  #stats { display: flex; justify-content: center; gap: 24px; margin: 10px 0 16px; font-size: 13px; color: rgba(200,224,208,0.5); }
  #stats em { font-style: normal; color: #66dd88; font-weight: 600; }
  #difficulty { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .diff-btn {
    background: rgba(102,221,136,0.1); border: 1px solid rgba(102,221,136,0.2);
    color: rgba(200,224,208,0.6); padding: 6px 16px; border-radius: 8px;
    font-size: 12px; cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .diff-btn:hover { background: rgba(102,221,136,0.2); }
  .diff-btn.active { background: rgba(102,221,136,0.25); border-color: #66dd88; color: #c8e0d0; }
  #grid {
    display: grid; gap: 8px; justify-content: center; margin: 0 auto;
    max-width: 520px;
  }
  .card {
    aspect-ratio: 1; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #1a3a22, #0f2818);
    border: 1px solid rgba(102,221,136,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; transition: all .3s ease;
    user-select: none; position: relative;
    min-width: 50px; min-height: 50px;
  }
  .card:hover { border-color: rgba(102,221,136,0.5); transform: translateY(-2px); }
  .card.flipped { background: linear-gradient(135deg, #1a3a22, #0f2818); border-color: #66dd88; }
  .card.matched { background: linear-gradient(135deg, #2a4a2a, #1a3a1a); border-color: #88ffaa; cursor: default; opacity: 0.7; transform: scale(0.95); }
  .card.matched:hover { transform: scale(0.95); }
  .card .icon { transition: all .3s; }
  .card.flipped .icon { }
  .card.matched .icon { }
  #controls { margin-top: 16px; }
  #restart-btn {
    background: linear-gradient(135deg, #66dd88, #44bb66);
    border: none; color: #0a1a10; padding: 10px 28px; border-radius: 10px;
    font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;
    transition: all .2s;
  }
  #restart-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(102,221,136,0.4); }
  #constellation-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  #message {
    margin-top: 12px; font-size: 14px; color: rgba(200,224,208,0.5); min-height: 20px;
  }
  #message.win { color: #88ffaa; }
  @keyframes cardAppear {
    from { opacity: 0; transform: scale(0.8) rotateY(180deg); }
    to { opacity: 1; transform: scale(1) rotateY(0deg); }
  }
  .card.just-flipped { animation: cardAppear .3s ease-out; }
  @keyframes matchPulse {
    0% { box-shadow: 0 0 0 0 rgba(136,255,170,0.6); }
    70% { box-shadow: 0 0 0 15px rgba(136,255,170,0); }
    100% { box-shadow: 0 0 0 0 rgba(136,255,170,0); }
  }
  .card.just-matched { animation: matchPulse .5s ease-out; }
</style>
  <script src="../bridge.js"></script>
</head>
<body>
<div id="game">
  <h1>✦ <span>Memory</span> Meadow</h1>
  <p style="font-size:12px;color:rgba(200,224,208,0.3);margin-bottom:8px;">Match the flowers in the meadow</p>
  <div id="stats">
    <span>Moves: <em id="moves">0</em></span>
    <span>Time: <em id="timer">0s</em></span>
    <span>Pairs: <em id="pairs">0</em>/<em id="total-pairs">0</em></span>
  </div>
  <div id="difficulty">
    <button class="diff-btn active" data-size="12">Easy (12)</button>
    <button class="diff-btn" data-size="20">Medium (20)</button>
    <button class="diff-btn" data-size="30">Hard (30)</button>
  </div>
  <div style="position:relative">
    <div id="grid"></div>
    <svg id="constellation-overlay"></svg>
  </div>
  <div id="controls" style="display:flex;gap:8px;justify-content:center">
    <button id="restart-btn">New Game</button>
    <button id="constellation-toggle" style="background:rgba(102,221,136,0.1);border:1px solid rgba(102,221,136,0.2);color:rgba(200,224,208,0.6);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit">🌸 Show Garden</button>
  </div>
  <div id="message">Flip two flowers to find a match</div>
</div>

<script>
// ─── Meadow icons ───
const ICONS = [
  '🌻','🌷','🌹','🌸','🌺','🌿','🍀','🌼','🌾','🍁',
  '🌱','🌳','🌲','🍃','🌰','🐝','🦋','🐞','🌸','🌺',
  '🌻','🌷','🌹','🌸','🌺','🌿','🍀','🌼','🌾','🍁',
];

// ─── Sound effects via Web Audio ───
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTone(freq, duration, type='sine', vol=0.15) {
  try {
    initAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function sfxFlip() { playTone(600, 0.1, 'sine', 0.1); }
function sfxMatch() { playTone(880, 0.15); setTimeout(() => playTone(1100, 0.2), 100); }
function sfxWin() {
  [0,100,200,300,400].forEach((d,i) => setTimeout(() => playTone(523 + i*130, 0.2), d));
}

// ─── Game State ───
// ─── Constellation system ───
let matchedPairs = [];
let constellationVisible = false;
const overlaySvg = document.getElementById('constellation-overlay');
const toggleBtn = document.getElementById('constellation-toggle');

function updateConstellationOverlay() {
  // Update SVG size to match grid
  const gridRect = document.getElementById('grid').getBoundingClientRect();
  const containerRect = overlaySvg.parentElement.getBoundingClientRect();
  overlaySvg.setAttribute('width', containerRect.width);
  overlaySvg.setAttribute('height', containerRect.height);
  overlaySvg.setAttribute('viewBox', `0 0 ${containerRect.width} ${containerRect.height}`);
  
  overlaySvg.innerHTML = '';
  if (!constellationVisible || matchedPairs.length === 0) return;
  
  const gridEl = document.getElementById('grid');
  const cards = gridEl.children;
  
  matchedPairs.forEach(([idxA, idxB]) => {
    const cardA = cards[idxA];
    const cardB = cards[idxB];
    if (!cardA || !cardB) return;
    
    const rectA = cardA.getBoundingClientRect();
    const rectB = cardB.getBoundingClientRect();
    const contRect = overlaySvg.parentElement.getBoundingClientRect();
    
    const x1 = rectA.left - contRect.left + rectA.width / 2;
    const y1 = rectA.top - contRect.top + rectA.height / 2;
    const x2 = rectB.left - contRect.left + rectB.width / 2;
    const y2 = rectB.top - contRect.top + rectB.height / 2;
    
    // Glowing line
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', 'rgba(102,221,136,0.4)');
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '4,6');
    line.setAttribute('stroke-linecap', 'round');
    overlaySvg.appendChild(line);
    
    // Star at midpoint
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    star.setAttribute('cx', mx); star.setAttribute('cy', my);
    star.setAttribute('r', '3');
    star.setAttribute('fill', 'rgba(255,255,255,0.6)');
    star.setAttribute('filter', 'url(#glow)');
    overlaySvg.appendChild(star);
  });
  
  // Add glow filter
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = '<filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  overlaySvg.prepend(defs);
}

toggleBtn.addEventListener('click', () => {
  constellationVisible = !constellationVisible;
  toggleBtn.textContent = constellationVisible ? '🌸 Hide Garden' : '🌸 Show Garden';
  updateConstellationOverlay();
});

window.addEventListener('resize', () => { if (constellationVisible) updateConstellationOverlay(); });

let state = {
  cards: [],
  flipped: [],
  matched: 0,
  moves: 0,
  totalPairs: 0,
  timer: 0,
  timerInterval: null,
  isLocked: false,
  difficulty: 12,
  bestScores: {},
};

// ─── DOM ───
const grid = document.getElementById('grid');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const pairsEl = document.getElementById('pairs');
const totalPairsEl = document.getElementById('total-pairs');
const messageEl = document.getElementById('message');
const restartBtn = document.getElementById('restart-btn');
const diffBtns = document.querySelectorAll('.diff-btn');

// ─── Shuffle ───
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ─── Timer ───
function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timer = 0;
  state.timerInterval = setInterval(() => {
    state.timer++;
    timerEl.textContent = state.timer + 's';
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ─── Init Game ───
function initGame(size) {
  matchedPairs = [];
  if (constellationVisible) { constellationVisible = false; toggleBtn.textContent = '🌟 Show Constellation'; }
  overlaySvg.innerHTML = '';
  stopTimer();
  const pairCount = size / 2;
  const chosen = shuffle([...ICONS]).slice(0, pairCount);
  const deck = shuffle([...chosen, ...chosen]);

  state.cards = deck.map((icon, i) => ({ id: i, icon, matched: false, flipped: false }));
  state.flipped = [];
  state.matched = 0;
  state.moves = 0;
  state.totalPairs = pairCount;
  state.isLocked = false;
  state.difficulty = size;

  movesEl.textContent = '0';
  pairsEl.textContent = '0';
  totalPairsEl.textContent = pairCount;
  messageEl.textContent = 'Flip two cards to find a match';
  messageEl.className = '';

  // Calculate columns based on size
  let cols;
  if (size === 12) cols = 4;
  else if (size === 20) cols = 5;
  else cols = 6;

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  renderCards();
  startTimer();
}

// ─── Render ───
function renderCards() {
  grid.innerHTML = '';
  state.cards.forEach((card, idx) => {
    const el = document.createElement('div');
    el.className = 'card';
    if (card.flipped || card.matched) el.classList.add('flipped');
    if (card.matched) el.classList.add('matched');
    el.dataset.index = idx;

    const iconSpan = document.createElement('span');
    iconSpan.className = 'icon';
    iconSpan.textContent = card.flipped || card.matched ? card.icon : '✦';
    el.appendChild(iconSpan);

    el.addEventListener('click', () => handleClick(idx));
    grid.appendChild(el);
  });
}

function updateCard(idx) {
  const el = grid.children[idx];
  if (!el) return;
  const card = state.cards[idx];
  el.className = 'card';
  if (card.flipped || card.matched) el.classList.add('flipped');
  if (card.matched) el.classList.add('matched');
  el.querySelector('.icon').textContent = (card.flipped || card.matched) ? card.icon : '✦';
}

// ─── Click Handler ───
function handleClick(idx) {
  const card = state.cards[idx];
  if (state.isLocked || card.flipped || card.matched || state.flipped.length >= 2) return;
  if (!state.timerInterval) startTimer();

  card.flipped = true;
  state.flipped.push(idx);
  sfxFlip();
  updateCard(idx);
  grid.children[idx]?.classList.add('just-flipped');

  if (state.flipped.length === 2) {
    state.moves++;
    movesEl.textContent = state.moves;
    checkMatch();
  }
}

function checkMatch() {
  state.isLocked = true;
  const [a, b] = state.flipped;
  const cardA = state.cards[a];
  const cardB = state.cards[b];

  if (cardA.icon === cardB.icon) {
    // Match!
    matchedPairs.push([a, b]);
    if (constellationVisible) setTimeout(updateConstellationOverlay, 300);
    setTimeout(() => {
      cardA.matched = true; cardB.matched = true;
      cardA.flipped = true; cardB.flipped = true;
      state.matched++;
      pairsEl.textContent = state.matched;
      sfxMatch();
      updateCard(a); updateCard(b);
      grid.children[a]?.classList.add('just-matched');
      grid.children[b]?.classList.add('just-matched');
      state.flipped = [];
      state.isLocked = false;

      if (state.matched === state.totalPairs) {
        gameWon();
      }
    }, 400);
  } else {
    // No match — flip back
    setTimeout(() => {
      cardA.flipped = false; cardB.flipped = false;
      updateCard(a); updateCard(b);
      state.flipped = [];
      state.isLocked = false;
    }, 800);
  }
}

function gameWon() {
  stopTimer();
  sfxWin();
  messageEl.textContent = `✨ All flowers matched! ${state.moves} moves in ${state.timer}s`;
  messageEl.className = 'win';

  // Save best score
  const key = `diff_${state.difficulty}`;
  const prev = state.bestScores[key];
  if (!prev || state.moves < prev.moves) {
    state.bestScores[key] = { moves: state.moves, time: state.timer };
    if (window.gameBridge) {
      window.gameBridge.save({ bestScores: state.bestScores }).catch(() => {});
    }
  }
}

// ─── Load Best Scores ───
async function loadScores() {
  if (!window.gameBridge) return;
  try {
    const data = await window.gameBridge.load();
    if (data && data.bestScores) {
      state.bestScores = data.bestScores;
    }
  } catch(e) {}
}

// ─── Difficulty Switching ───
diffBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    diffBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initGame(parseInt(btn.dataset.size));
  });
});

restartBtn.addEventListener('click', () => {
  const active = document.querySelector('.diff-btn.active');
  initGame(parseInt(active ? active.dataset.size : 12));
});

// ─── Init ───
loadScores();
initGame(12);

// Expose for gameBridge save/load buttons
window.__gameSaveData = () => ({ bestScores: state.bestScores });
window.__gameLoadData = (data) => {
  if (data && data.bestScores) state.bestScores = data.bestScores;
};
</script>
</body>
</html>
