<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Pong</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#c8c8e0;display:flex;justify-content:center;align-items:center;height:100vh}
#game-wrapper{position:relative}
canvas{display:block;border-radius:12px}
#hud{position:absolute;top:10px;left:0;right:0;text-align:center;pointer-events:none}
#hud>div{display:inline-flex;gap:40px;font-size:28px;font-weight:300}
#hud em{font-style:normal;font-weight:700}
#hud .ps{color:#ff44aa}
#hud .as{color:#44ddff}
#powerup-hud{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.pu-tag{padding:3px 10px;border-radius:6px;font-size:11px;background:rgba(10,10,20,0.7);border:1px solid rgba(200,200,224,0.1);opacity:0;transition:opacity.3s}
.pu-tag.show{opacity:1}
#game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:20;background:rgba(10,10,20,0.9);padding:24px 40px;border-radius:16px;border:1px solid rgba(200,200,224,0.1)}
#game-over h1{font-size:32px;margin-bottom:4px}
#game-over h1.win{color:#ff44aa}
#game-over h1.lose{color:#44ddff}
#game-over p{font-size:13px;color:rgba(200,200,224,0.5);margin:2px 0}
#game-over .stat{font-size:15px;color:#ffdd66;font-weight:600;margin:4px 0}
#game-over button{background:linear-gradient(135deg,#ff44aa,#cc2277);border:none;color:#fff;padding:10px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;transition:all.2s}
#game-over button:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,68,170,0.3)}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(200,200,224,0.12);pointer-events:none}
</style>
  <script src="../bridge.js"></script>
</head>
<body>
<div id="game-wrapper">
<canvas id="game"></canvas>
<div id="hud">
  <div><em class="ps" id="ps">0</em> : <em class="as" id="as">0</em></div>
</div>
<div id="powerup-hud"></div>
<div id="game-over">
  <h1 id="result-title">GAME OVER</h1>
  <p class="stat">⭐ <span id="final-score">0</span></p>
  <p>Rally: <span id="final-rally">0</span> · Speed: <span id="final-speed">0</span></p>
  <button id="restart-btn">PLAY AGAIN</button>
</div>
<div id="hint">Move mouse to control paddle · Power-ups appear during play!</div>
</div>

<script>
// ─── Audio ───
let actx=null;
function ia(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)()}
function tn(f,d,t='sine',v=0.06){try{ia();let o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sfxHit(){tn(440,0.06,'sine',0.06)}
function sfxWall(){tn(330,0.04,'sine',0.04)}
function sfxScore(){tn(250,0.15,'sawtooth',0.06);setTimeout(()=>tn(180,0.2,'sawtooth',0.04),80)}
function sfxPowerup(){tn(600,0.08);setTimeout(()=>tn(800,0.08),60);setTimeout(()=>tn(1000,0.08),120)}
function sfxWin(){[0,120,240,360].forEach((d,i)=>setTimeout(()=>tn(440+i*110,0.2,'sine',0.07),d))}

// ─── Canvas ───
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=500;

const PADDLE_W=12,PADDLE_H=80,BALL_R=7;
let playerY,aiY,balls,powerups,particles,trail;
let playerScore=0,aiScore=0,rally=0,maxRally=0;
let gameOver=false,winner='',highScore=0;
let aiSpeed=4,difficulty=1,frame=0;
let playerPU={wide:0,slow:0},aiPU={};
let keys={};
let shakeX=0,shakeY=0,shakeIntensity=0;
function shake(n){shakeIntensity=Math.max(shakeIntensity,n);}

// ─── Power-up types ───
const POWERUPS=[
  {id:'wide',icon:'🔲',color:'#44ddff',desc:'Wide Paddle',duration:400},
  {id:'multi',icon:'🔴',color:'#ffdd44',desc:'Multi Ball',duration:0},
  {id:'slow',icon:'⏱️',color:'#44ff88',desc:'Slow Motion',duration:300},
];

function init(){
  playerY=canvas.height/2-PADDLE_H/2;
  aiY=canvas.height/2-PADDLE_H/2;
  balls=[createBall()];
  powerups=[];particles=[];trail=[];
  playerScore=0;aiScore=0;rally=0;maxRally=0;
  gameOver=false;winner='';difficulty=1;frame=0;
  playerPU={wide:0,slow:0};aiPU={};
  document.getElementById('game-over').style.display='none';
  document.getElementById('ps').textContent='0';
  document.getElementById('as').textContent='0';
  updatePUDisp();
}

function createBall(){
  return{
    x:canvas.width/2,y:canvas.height/2,
    vx:5*(Math.random()>0.5?1:-1),vy:(Math.random()*2-1)*3,
    r:BALL_R,trail:[],speed:5,
  };
}

// ─── Particles ───
function emit(x,y,count,color,speed=3){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const sp=0.5+Math.random()*speed;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*15,maxLife:35,color,size:1.5+Math.random()*2});
  }
}

// ─── Spawn Power-up ───
function spawnPU(){
  const pu=POWERUPS[Math.floor(Math.random()*POWERUPS.length)];
  powerups.push({
    x:canvas.width/2+(Math.random()-0.5)*200,
    y:40+Math.random()*(canvas.height-80),
    ...pu,life:500,
  });
}

// ─── Update ───
function update(){
  if(gameOver)return;
  frame++;

  // Difficulty scales with score
  difficulty=1+playerScore*0.15+aiScore*0.1;

  // Timers
  for(const k of Object.keys(playerPU)){
    if(playerPU[k]>0)playerPU[k]--;
  }

  // Spawn power-ups periodically
  if(frame%350===0&&powerups.length<2)spawnPU();

  // Player paddle
  const rect=canvas.getBoundingClientRect();
  // Use keys as alternative
  if(keys['arrowup']||keys['w'])playerY-=5;
  if(keys['arrowdown']||keys['s'])playerY+=5;
  
  const pw=playerPU.wide>0?PADDLE_W*2:PADDLE_W;
  playerY=Math.max(0,Math.min(canvas.height-PADDLE_H,playerY));

  // AI paddle with scaled difficulty
  let aiTarget=canvas.height/2;
  let closest=null,minDist=Infinity;
  for(const b of balls){
    if(b.vx>0&&b.x<canvas.width*0.7){
      const d=Math.abs(b.y-aiY-PADDLE_H/2);
      if(d<minDist){minDist=d;closest=b;}
    }
  }
  if(closest){
    aiTarget=closest.y-PADDLE_H/2+Math.sin(closest.y*0.1)*20;
  }
  const aiCenter=aiY+PADDLE_H/2;
  const diff=aiTarget-aiCenter;
  aiSpeed=3+difficulty*0.5;
  if(Math.abs(diff)>15)aiY+=Math.sign(diff)*Math.min(aiSpeed,Math.abs(diff)*0.08);
  aiY=Math.max(0,Math.min(canvas.height-PADDLE_H,aiY));

  // Balls
  const speedMult=playerPU.slow>0?0.5:1;
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    b.x+=b.vx*speedMult;
    b.y+=b.vy*speedMult;
    
    // Trail
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>12)b.trail.shift();

    // Wall bounce
    if(b.y-BALL_R<0||b.y+BALL_R>canvas.height){
      b.vy=-b.vy;
      sfxWall();
      emit(b.x,b.y,5,'rgba(255,255,255,0.3)',2);
    }

    // Player paddle
    const pw_actual=playerPU.wide>0?PADDLE_W*2:PADDLE_W;
    if(b.x-BALL_R<pw_actual&&b.y>playerY&&b.y<playerY+PADDLE_H){
      b.vx=Math.abs(b.vx);
      const hitPos=(b.y-(playerY+PADDLE_H/2))/(PADDLE_H/2);
      b.vy=hitPos*5+Math.random()*0.5;
      b.speed=Math.min(12,b.speed+0.15);
      b.vx=b.speed;
      emit(b.x,b.y,8,'#ff44aa',3);
      sfxHit();
      shake(3);
      rally++;
      if(rally>maxRally)maxRally=rally;
    }

    // AI paddle
    if(b.x+BALL_R>canvas.width-pw_actual&&b.y>aiY&&b.y<aiY+PADDLE_H){
      b.vx=-Math.abs(b.vx);
      const hitPos=(b.y-(aiY+PADDLE_H/2))/(PADDLE_H/2);
      b.vy=hitPos*4+Math.random()*0.5;
      emit(b.x,b.y,8,'#44ddff',3);
      sfxHit();
      shake(3);
    }

    // Scoring
    if(b.x<0){
      aiScore++;
      document.getElementById('as').textContent=aiScore;
      emit(b.x,b.y,20,'#44ddff',5);
      sfxScore();
      shake(5);
      rally=0;
      if(aiScore>=7){endGame('AI WINS!','lose');return;}
      balls.splice(i,1);
      continue;
    }
    if(b.x>canvas.width){
      playerScore++;
      document.getElementById('ps').textContent=playerScore;
      emit(b.x,b.y,20,'#ff44aa',5);
      sfxScore();
      shake(5);
      rally=0;
      if(playerScore>=7){endGame('YOU WIN!','win');return;}
      balls.splice(i,1);
      continue;
    }
  }

  // Respawn ball if none left
  if(balls.length===0)balls.push(createBall());

  // Power-ups
  for(let i=powerups.length-1;i>=0;i--){
    const pu=powerups[i];
    pu.life--;
    if(pu.life<=0){powerups.splice(i,1);continue;}
    
    // Collection by player paddle
    const pw_actual=playerPU.wide>0?PADDLE_W*2:PADDLE_W;
    if(pu.x<pw_actual&&pu.y>playerY&&pu.y<playerY+PADDLE_H){
      collectPU(pu);powerups.splice(i,1);continue;
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}

function collectPU(pu){
  sfxPowerup();
  emit(pu.x,pu.y,15,pu.color,4);
  if(pu.id==='wide'){playerPU.wide=pu.duration;}
  else if(pu.id==='slow'){playerPU.slow=pu.duration;}
  else if(pu.id==='multi'){
    const b=balls[0]||createBall();
    for(let i=0;i<2;i++){
      const nb=createBall();
      nb.x=b.x;nb.y=b.y;
      nb.vx=b.vx*(Math.random()>0.5?1:-1);
      nb.vy=(Math.random()*2-1)*4;
      balls.push(nb);
    }
  }
  updatePUDisp();
}

function updatePUDisp(){
  const c=document.getElementById('powerup-hud');
  c.innerHTML='';
  for(const [k,v] of Object.entries(playerPU)){
    if(v>0){
      const el=document.createElement('span');
      el.className='pu-tag show';
      const names={wide:'🔲 Wide',slow:'⏱️ Slow'};
      el.textContent=names[k]+' '+(v/60|0)+'s';
      c.appendChild(el);
    }
  }
}

function endGame(title,cls){
  gameOver=true;winner=title;
  const go=document.getElementById('game-over');
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-title').className=cls;
  document.getElementById('final-score').textContent=playerScore+'-'+aiScore;
  document.getElementById('final-rally').textContent=maxRally;
  document.getElementById('final-speed').textContent=Math.round(balls[0]?.speed||5);
  go.style.display='block';
  sfxWin();
  
  const score=playerScore*100+maxRally*10;
  if(score>highScore){
    highScore=score;
    if(window.gameBridge)window.gameBridge.save({highScore}).catch(()=>{});
  }
}

// ─── Draw ───
function draw(){
  // Screen shake
  if(shakeIntensity>0){
    shakeX=(Math.random()-0.5)*shakeIntensity;
    shakeY=(Math.random()-0.5)*shakeIntensity;
    shakeIntensity*=0.85;
    if(shakeIntensity<0.5){shakeIntensity=0;shakeX=0;shakeY=0;}
  }else{shakeX=0;shakeY=0;}
  
  ctx.save();
  ctx.translate(shakeX,shakeY);
  ctx.fillStyle='#0a0a14';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Neon grid pattern
  ctx.strokeStyle='rgba(200,200,224,0.03)';
  ctx.lineWidth=0.5;
  const gridSize=40;
  for(let x=0;x<canvas.width;x+=gridSize){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=gridSize){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }

  // Animated horizontal scanlines
  ctx.fillStyle=`rgba(255,68,170,${0.015+0.01*Math.sin(frame*0.02)})`;
  const scanY=(frame*1.2)%canvas.height;
  ctx.fillRect(0,scanY,canvas.width,2);

  // Center line (glowing)
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.lineWidth=1;
  ctx.setLineDash([8,16]);
  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);
  ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ball trails
  for(const b of balls){
    for(let i=0;i<b.trail.length;i++){
      const t=b.trail[i];
      const alpha=(i/b.trail.length)*0.5;
      ctx.fillStyle=`rgba(255,68,170,${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x,t.y,BALL_R*(i/b.trail.length)*0.7,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Balls
  for(const b of balls){
    ctx.fillStyle='#ff44aa';
    ctx.shadowColor='#ff44aa';
    ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    // Core
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(b.x-1.5,b.y-1.5,BALL_R*0.35,0,Math.PI*2);
    ctx.fill();
  }

  // Power-ups
  for(const pu of powerups){
    const pulse=Math.sin(frame*0.06)*0.2+0.8;
    ctx.fillStyle=pu.color;
    ctx.shadowColor=pu.color;
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(pu.x,pu.y,10*pulse,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='11px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.icon,pu.x,pu.y+1);
  }

  // Player paddle
  const pw=playerPU.wide>0?PADDLE_W*2:PADDLE_W;
  ctx.fillStyle='#00d4ff';
  ctx.shadowColor='#00d4ff';
  ctx.shadowBlur=10;
  const grad=ctx.createLinearGradient(0,playerY,0,playerY+PADDLE_H);
  grad.addColorStop(0,'rgba(0,212,255,0.9)');
  grad.addColorStop(0.5,'rgba(0,212,255,0.5)');
  grad.addColorStop(1,'rgba(0,212,255,0.9)');
  ctx.fillStyle=grad;
  ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.roundRect(0,playerY,pw,PADDLE_H,4);
  ctx.fill();
  ctx.shadowBlur=0;

  // AI paddle
  ctx.fillStyle='#ff4466';
  ctx.shadowColor='#ff4466';
  ctx.shadowBlur=8;
  const grad2=ctx.createLinearGradient(canvas.width,aiY,canvas.width,aiY+PADDLE_H);
  grad2.addColorStop(0,'rgba(255,68,102,0.9)');
  grad2.addColorStop(0.5,'rgba(255,68,102,0.5)');
  grad2.addColorStop(1,'rgba(255,68,102,0.9)');
  ctx.fillStyle=grad2;
  ctx.beginPath();
  ctx.roundRect(canvas.width-pw,aiY,pw,PADDLE_H,4);
  ctx.fill();
  ctx.shadowBlur=0;

  // Particles
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  
  ctx.restore();
}

// ─── RoundRect polyfill for canvas ───
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r>w/2)r=w/2;if(r>h/2)r=h/2;
    this.moveTo(x+r,y);
    this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r);
    return this;
  };
}

// ─── Controls ───
canvas.addEventListener('mousemove',e=>{
  if(gameOver)return;
  const rect=canvas.getBoundingClientRect();
  const scaleY=canvas.height/rect.height;
  playerY=(e.clientY-rect.top)*scaleY-PADDLE_H/2;
  playerY=Math.max(0,Math.min(canvas.height-PADDLE_H,playerY));
});

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.getElementById('restart-btn').addEventListener('click',init);

// ─── Loop ───
function loop(){update();draw();requestAnimationFrame(loop);}

// ─── Save/Load ───
async function loadHS(){
  if(!window.gameBridge)return;
  try{const d=await window.gameBridge.load();if(d&&d.highScore)highScore=d.highScore;}catch(e){}
}
window.__gameSaveData=()=>({highScore});
window.__gameLoadData=(d)=>{if(d&&d.highScore)highScore=d.highScore;};

loadHS();
init();
loop();
</script>
</body>
</html>
