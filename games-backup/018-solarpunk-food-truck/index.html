<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solarpunk Food Truck</title>
<link rel="stylesheet" href="style.css">
<script src="../bridge.js"></script>
</head>
<body>
<div id="app">
  <!-- HUD Bar -->
  <div id="hud-bar">
    <span class="game-title">☀ <em>Solarpunk</em> Truck</span>
    <div id="hud-actions">
      <button class="game-btn" id="upgrade-btn" style="font-size:11px;padding:4px 10px;">🔧 Upgrades</button>
      <button class="game-btn" id="reset-btn" style="font-size:11px;padding:4px 10px;">🔄 New</button>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content">
    <!-- Morning Phase -->
    <div id="morning-view" class="view active">
      <div id="morning-content"></div>
    </div>

    <!-- Service Phase -->
    <div id="service-view" class="view">
      <div id="service-content"></div>
    </div>

    <!-- Evening Phase -->
    <div id="evening-view" class="view">
      <div id="evening-content"></div>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-view" class="view">
      <div id="upgrade-content"></div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="status-toast" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(10,20,16,0.92);border:1px solid rgba(102,221,136,0.2);border-radius:8px;padding:8px 20px;font-size:13px;color:#66dd88;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none;">
    💾 Saved!
  </div>
</div>
<style>
#status-toast.show { opacity: 1; }
</style>
<script type="module" src="main.js"></script>
</body>
</html>
