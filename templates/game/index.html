<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>__TITLE__</title>
		<link rel="stylesheet" href="style.css" />
		<!-- The Game Galaxy SDK: saves, scores, achievements. -->
		<script src="/sdk/galaxy.js"></script>
	</head>
	<body>
		<canvas id="field" aria-label="Game field"></canvas>

		<header class="hud" aria-live="polite">
			<div><span class="label">Pulses</span><strong id="score">0</strong></div>
			<div><span class="label">Time</span><strong id="time">30</strong></div>
			<div><span class="label">Best</span><strong id="best">—</strong></div>
		</header>

		<section id="overlay" class="overlay">
			<div class="card">
				<p class="eyebrow" id="greeting">Welcome</p>
				<h1>__TITLE__</h1>
				<p id="message">Catch as many pulses as you can in 30 seconds.</p>
				<button id="start" type="button">Start</button>
			</div>
		</section>

		<script src="game.js"></script>
	</body>
</html>
