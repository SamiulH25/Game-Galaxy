<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
	<defs>
		<radialGradient id="bg" cx="50%" cy="45%" r="75%">
			<stop offset="0" stop-color="#16244f" />
			<stop offset="1" stop-color="#05070f" />
		</radialGradient>
		<radialGradient id="pulse">
			<stop offset="0" stop-color="#d6efff" />
			<stop offset="0.45" stop-color="#7cc4ff" stop-opacity="0.7" />
			<stop offset="1" stop-color="#7cc4ff" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect width="640" height="360" fill="url(#bg)" />
	<circle cx="200" cy="150" r="70" fill="url(#pulse)" />
	<circle cx="420" cy="220" r="48" fill="url(#pulse)" opacity="0.8" />
	<circle cx="510" cy="110" r="30" fill="url(#pulse)" opacity="0.6" />
	<circle cx="320" cy="290" r="22" fill="url(#pulse)" opacity="0.5" />
