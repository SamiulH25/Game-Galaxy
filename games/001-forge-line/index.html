<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Forge Line — Helios Belt Mining</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <script src="../bridge.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" aria-label="Forge Line conveyor grid"></canvas>

    <div id="hud-top">
      <div class="hud-item hud-ore">
        <span class="hud-label">ORE</span>
        <span id="hud-ore" class="hud-value">150</span>
        <span id="hud-income" class="hud-income">+2/s</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">REACTOR</span>
        <span id="hud-reactor" class="hud-value">♥♥♥♥♥</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">WAVE</span>
        <span id="hud-wave" class="hud-value">1 / 3</span>
      </div>
      <div class="hud-item hud-level">
        <span class="hud-label">SHIFT</span>
        <span id="hud-level" class="hud-value">1</span>
      </div>
    </div>

    <div id="wave-banner" class="wave-banner hidden" aria-live="assertive">
      <span id="wave-banner-text">WAVE 1</span>
    </div>

    <div id="rig-info" class="rig-info hidden" role="status" aria-live="polite">
      <div class="rig-info-icon" id="rig-info-icon" aria-hidden="true"></div>
      <div class="rig-info-text">
        <span id="rig-info-name" class="rig-info-name"></span>
        <span id="rig-info-desc" class="rig-info-desc"></span>
        <span id="rig-info-stats" class="rig-info-stats"></span>
      </div>
    </div>

    <div id="greg-bubble" class="greg-bubble hidden" role="status">
      <div class="greg-avatar" aria-hidden="true">G</div>
      <p id="greg-text" class="greg-text"></p>
    </div>

    <div id="unlock-backdrop" class="unlock-backdrop hidden" aria-hidden="true"></div>

    <div id="unlock-card" class="unlock-card hidden" role="dialog" aria-modal="true" aria-labelledby="unlock-title">
      <span class="unlock-badge" id="unlock-badge">NEW RIG</span>
      <div class="unlock-icon-wrap" id="unlock-icon" aria-hidden="true"></div>
      <h3 id="unlock-title" class="unlock-title"></h3>
      <p id="unlock-quote" class="unlock-quote hidden"></p>
      <div class="unlock-greg">
        <div class="greg-avatar" aria-hidden="true">G</div>
        <p id="unlock-greg-text" class="unlock-greg-text"></p>
      </div>
      <button type="button" id="unlock-dismiss" class="unlock-dismiss">DEPLOY</button>
    </div>

    <div id="seed-tray" class="seed-tray hidden"></div>

    <div id="toolbar" class="toolbar hidden">
      <button type="button" id="btn-shovel" class="tool-btn" title="Salvage wrench" aria-label="Salvage wrench">
        <svg class="tool-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.7 6.3l-3.4-3.4a1 1 0 0 0-1.4 0l-2.1 2.1-1.4-1.4 2.1-2.1a1 1 0 0 0 0-1.4L12.4 1.3a1 1 0 0 0-1.4 0L8.3 4l8 8 5.4-5.7zM2 20.8l6.2-6.2 1.4 1.4-6.2 6.2H2v-1.4z"/></svg>
        <span class="tool-label">SALVAGE</span>
      </button>
      <button type="button" id="btn-speed" class="tool-btn" title="Game speed (F)" aria-label="Game speed">
        <svg class="tool-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.06.5-9 4.76-9 9.95 0 5.52 4.47 10 9.99 10 3.31 0 6.24-1.61 8.06-4.09l-2.6-1.53A6.95 6.95 0 0 1 12 19z"/></svg>
        <span class="tool-label" id="speed-label">1×</span>
      </button>
      <button type="button" id="btn-pause" class="tool-btn" title="Pause" aria-label="Pause">
        <svg class="tool-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7V5zm7 0h3v14h-3V5z"/></svg>
        <span class="tool-label">PAUSE</span>
      </button>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-panel">
        <p class="overlay-stamp">HBMC · FORM 12-C</p>
        <h1 class="game-title">Forge Line</h1>
        <p class="subtitle">Helios Belt Mining Co.</p>
        <div id="overlay-body"></div>
      </div>
    </div>

    <div id="campaign-map" class="campaign-map hidden">
      <div class="map-header">
        <h2 id="map-world-title">Outer Belt</h2>
        <button type="button" id="btn-map-back" class="map-back">← Campaign</button>
      </div>
      <div id="level-nodes" class="level-nodes"></div>
    </div>
  </div>

  <script src="js/config.js?v=7"></script>
  <script src="js/spriteAtlas.js?v=4"></script>
  <script src="js/engine.js?v=7"></script>
  <script src="js/renderer.js?v=7"></script>
  <script src="js/audio.js?v=4"></script>
  <script src="js/main.js?v=10"></script>
</body>
</html>
