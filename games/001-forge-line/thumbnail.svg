<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2622"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6560"/>
      <stop offset="100%" stop-color="#3d3935"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8b3a1f"/>
      <stop offset="50%" stop-color="#c45c2a"/>
      <stop offset="100%" stop-color="#f0a060"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#f0a060" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c45c2a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c45c2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Asteroid cavern backdrop -->
  <rect width="256" height="256" fill="url(#rock)"/>
  <ellipse cx="128" cy="200" rx="140" ry="80" fill="#0e0c0a" opacity="0.6"/>
  <path d="M0 180 Q60 140 128 155 T256 175 L256 256 L0 256 Z" fill="#1c1916"/>
  <circle cx="40" cy="50" r="28" fill="#242019" opacity="0.5"/>
  <circle cx="210" cy="70" r="36" fill="#1e1b18" opacity="0.45"/>

  <!-- Conveyor platform -->
  <rect x="32" y="108" width="192" height="72" rx="4" fill="url(#steel)" stroke="#2a2622" stroke-width="2"/>
  <line x1="64" y1="108" x2="58" y2="180" stroke="#1c1917" stroke-width="1" opacity="0.5"/>
  <line x1="96" y1="108" x2="90" y2="180" stroke="#1c1917" stroke-width="1" opacity="0.5"/>
  <line x1="128" y1="108" x2="122" y2="180" stroke="#1c1917" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="108" x2="154" y2="180" stroke="#1c1917" stroke-width="1" opacity="0.5"/>
  <line x1="192" y1="108" x2="186" y2="180" stroke="#1c1917" stroke-width="1" opacity="0.5"/>

  <!-- Core reactor (left) -->
  <rect x="24" y="118" width="36" height="52" rx="3" fill="#3d3935" stroke="#4a4540" stroke-width="1.5"/>
  <rect x="30" y="128" width="24" height="4" fill="#1c1917"/>
  <rect x="30" y="138" width="24" height="4" fill="#1c1917"/>
  <rect x="30" y="148" width="24" height="4" fill="#1c1917"/>
  <ellipse cx="42" cy="148" rx="18" ry="22" fill="url(#coreGlow)" filter="url(#soft)"/>

  <!-- Ore collector rig -->
  <rect x="78" y="128" width="32" height="28" rx="2" fill="#5c5650"/>
  <rect x="86" y="112" width="16" height="18" rx="2" fill="#8b6040"/>
  <circle cx="94" cy="122" r="5" fill="#2a2018" stroke="#6b6560"/>
  <ellipse cx="90" cy="104" rx="4" ry="5" fill="#e8e0d8" opacity="0.45"/>
  <ellipse cx="98" cy="100" rx="3" ry="4" fill="#e8e0d8" opacity="0.3"/>

  <!-- Rivet cannon -->
  <rect x="124" y="132" width="36" height="22" rx="2" fill="#4a4540"/>
  <rect x="156" y="136" width="18" height="10" rx="1" fill="#3d3935"/>
  <circle cx="172" cy="141" r="3" fill="#1c1917"/>

  <!-- Scrap golem -->
  <rect x="188" y="124" width="34" height="40" rx="4" fill="#5a4030" stroke="#3a2820"/>
  <rect x="194" y="118" width="22" height="8" rx="2" fill="#4a3530"/>
  <circle cx="198" cy="138" r="4" fill="#e07840"/>
  <circle cx="212" cy="138" r="4" fill="#e07840"/>
  <rect x="196" y="152" width="8" height="10" rx="1" fill="#3a2820"/>
  <rect x="208" y="152" width="8" height="10" rx="1" fill="#3a2820"/>

  <!-- Hazard blast door accent -->
  <rect x="54" y="138" width="5" height="18" rx="1" fill="#c9a227"/>

  <!-- Title plate -->
  <rect x="48" y="196" width="160" height="36" rx="2" fill="#1e1b18" stroke="#4a4540"/>
  <text x="128" y="218" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" fill="#e8e4dc" letter-spacing="3">FORGE LINE</text>
  <text x="128" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#a8a29e">Helios Belt Mining Co.</text>
</svg>
