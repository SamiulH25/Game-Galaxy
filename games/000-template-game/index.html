<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Salvage — Game Galaxy Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="../bridge.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" tabindex="0" aria-label="Star Salvage playfield"></canvas>

    <div id="hud-top">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="hud-score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">LIVES</span>
        <span id="hud-lives" class="hud-value">♥♥♥</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">GOAL</span>
        <span id="hud-goal" class="hud-value">300</span>
      </div>
    </div>

    <div id="touch-controls">
      <button type="button" class="touch-btn" data-dir="-1" aria-label="Move left">&#9664;</button>
      <button type="button" class="touch-btn touch-btn-fire" data-action="fire" aria-label="Fire">&#9670;</button>
      <button type="button" class="touch-btn" data-dir="1" aria-label="Move right">&#9654;</button>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-content">
        <h1 class="game-title">STAR SALVAGE</h1>
        <p class="subtitle">GAME GALAXY TEMPLATE</p>
        <div id="overlay-body"></div>
      </div>
    </div>

    <p class="file-hint">js/config · engine · renderer · audio · main</p>
  </div>

  <script src="js/config.js?v=2"></script>
  <script src="js/engine.js?v=2"></script>
  <script src="js/renderer.js?v=2"></script>
  <script src="js/audio.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
