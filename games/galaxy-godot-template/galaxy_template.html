<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$GODOT_PROJECT_NAME</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { width: 100%; height: 100%; display: block; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0a1a; color: #44dd88; font-family: 'Courier New', monospace;
      font-size: 18px; z-index: 10; transition: opacity 0.5s;
    }
    #loading .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(68,221,136,0.15);
      border-top-color: #44dd88; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .progress-text { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 8px; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Game...</div>
    <div class="progress-text" id="progress-text"></div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="$GODOT_URL"></script>
  <script>
    // ── Galaxy API Bridge ─────────────────────────────────────────────
    // Receives auth token from parent GameFrame via postMessage.
    // Exposes methods Godot calls via JavaScriptBridge.
    (function() {
      var _token = null;
      var _gameId = null;
      var _ready = false;

      // Listen for auth token from parent frame
      window.addEventListener('message', function(e) {
        var msg = e.data;
        if (msg && msg.type === 'galaxy-auth') {
          _token = msg.token;
          _gameId = msg.gameId;
          _ready = true;
        }
      });

      // Tell parent we're alive and ready for auth
      window.parent.postMessage({ type: 'galaxy-ready' }, '*');

      // API methods callable from Godot via JavaScriptBridge
      window.GalaxyAPI = {
        isReady: function() { return _ready; },
        getToken: function() { return _token; },
        getGameId: function() { return _gameId; },

        save: function(data) {
          if (!_token || !_gameId) return Promise.resolve(null);
          return fetch('/api/saves/' + _gameId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token },
            body: JSON.stringify({ save_data: data })
          }).then(function(r) {
            if (!r.ok) throw new Error('Save failed: ' + r.status);
            return r.json();
          }).catch(function(err) {
            console.error('[Galaxy] save error:', err);
            return null;
          });
        },

        load: function() {
          if (!_token || !_gameId) return Promise.resolve(null);
          return fetch('/api/saves/' + _gameId, {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + _token }
          }).then(function(r) {
            if (!r.ok) throw new Error('Load failed: ' + r.status);
            return r.json();
          }).catch(function(err) {
            console.error('[Galaxy] load error:', err);
            return null;
          });
        },

        unlockAchievement: function(achievementId) {
          if (!_token || !_gameId) return Promise.resolve(null);
          return fetch('/api/achievements/' + _gameId + '/unlock', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token },
            body: JSON.stringify({ achievement_id: achievementId })
          }).then(function(r) { return r.json(); })
            .catch(function(err) { console.error('[Galaxy] achievement error:', err); return null; });
        },

        submitScore: function(scoreData) {
          if (!_token || !_gameId) return Promise.resolve(null);
          return fetch('/api/leaderboards/' + _gameId + '/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _token },
            body: JSON.stringify({ score_data: scoreData })
          }).then(function(r) { return r.json(); })
            .catch(function(err) { console.error('[Galaxy] score error:', err); return null; });
        }
      };
    })();

    // ── Start Godot Engine ───────────────────────────────────────────
    var engine = new Engine($GODOT_CONFIG);
    engine.startGame({
      onProgress: function(current, total) {
        var el = document.getElementById('progress-text');
        if (total > 0) {
          var pct = Math.round((current / total) * 100);
          el.textContent = pct + '%';
          if (pct >= 100) {
            var loading = document.getElementById('loading');
            loading.style.opacity = '0';
            setTimeout(function() { loading.style.display = 'none'; }, 500);
          }
        }
      }
    }).catch(function(err) {
      document.getElementById('loading').innerHTML = '<p style="color:#e84646">Failed to load game</p><p style="font-size:14px;color:rgba(255,255,255,0.3)">' + err.message + '</p>';
    });
  </script>
</body>
</html>
