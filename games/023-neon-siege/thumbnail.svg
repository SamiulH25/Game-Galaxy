<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00ffcc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#66ffff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="#020810"/>
  <!-- Grid -->
  <g stroke="rgba(0,255,200,0.12)" stroke-width="1">
    <line x1="0" y1="64" x2="256" y2="64"/><line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/><line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/><line x1="192" y1="0" x2="192" y2="256"/>
  </g>
  <circle cx="128" cy="128" r="90" fill="url(#glow)"/>
  <!-- Player ship -->
  <polygon points="128,72 108,148 128,132 148,148" fill="url(#ship)" filter="url(#none)"/>
  <!-- Enemies -->
  <circle cx="60" cy="80" r="10" fill="none" stroke="#ff44aa" stroke-width="2" opacity="0.8"/>
  <circle cx="196" cy="90" r="8" fill="#ff6644" opacity="0.7"/>
  <circle cx="180" cy="180" r="12" fill="none" stroke="#aa44ff" stroke-width="2"/>
  <circle cx="70" cy="190" r="6" fill="#44ff88" opacity="0.8"/>
  <!-- Bullets -->
  <circle cx="100" cy="110" r="3" fill="#ffff66"/>
  <circle cx="155" cy="105" r="3" fill="#ffff66"/>
  <circle cx="128" cy="95" r="4" fill="#ffffff"/>
</svg>
