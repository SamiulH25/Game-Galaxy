    <line x1="184" y1="18" x2="184" y2="238"/>
    <line x1="58" y1="40" x2="198" y2="40"/><line x1="58" y1="62" x2="198" y2="62"/>
    <line x1="58" y1="84" x2="198" y2="84"/><line x1="58" y1="106" x2="198" y2="106"/>
    <line x1="58" y1="128" x2="198" y2="128"/><line x1="58" y1="150" x2="198" y2="150"/>
