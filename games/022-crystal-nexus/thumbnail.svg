<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#14102a"/>
    </linearGradient>
    <linearGradient id="piece1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8844ff"/>
      <stop offset="100%" stop-color="#aa66ff"/>
    </linearGradient>
    <linearGradient id="piece2" x1="0" y1="0" x2="1" y2="1">
