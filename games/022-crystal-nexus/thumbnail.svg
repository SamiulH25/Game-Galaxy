  <rect x="87" y="41" width="12" height="12" rx="2" fill="url(#piece1)" opacity="0.9"/>
  <rect x="101" y="41" width="12" height="12" rx="2" fill="url(#piece1)" opacity="0.9"/>
  <rect x="115" y="63" width="12" height="12" rx="2" fill="url(#piece2)" opacity="0.9"/>
  <rect x="129" y="63" width="12" height="12" rx="2" fill="url(#piece2)" opacity="0.9"/>
  <rect x="143" y="63" width="12" height="12" rx="2" fill="url(#piece2)" opacity="0.9"/>
  <rect x="87" y="85" width="12" height="12" rx="2" fill="url(#piece3)" opacity="0.9"/>
  <rect x="101" y="85" width="12" height="12" rx="2" fill="url(#piece3)" opacity="0.9"/>
  <rect x="115" y="85" width="12" height="12" rx="2" fill="url(#piece3)" opacity="0.9"/>
  <rect x="73" y="107" width="12" height="12" rx="2" fill="url(#piece4)" opacity="0.9"/>
