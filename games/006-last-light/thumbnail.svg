<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#050a16"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8a838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd88f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8a838" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fa3bd" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8fa3bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Beam cone sweeping east -->
  <path d="M200 200 L392 138 L392 262 Z" fill="url(#beam)"/>

  <!-- Reef ring with eastern gap -->
  <g fill="#1b2030" stroke="#e8f0f8" stroke-opacity="0.28" stroke-width="1.4">
    <circle cx="72" cy="150" r="9"/>
    <circle cx="60" cy="200" r="7"/>
    <circle cx="76" cy="252" r="8"/>
    <circle cx="120" cy="310" r="8"/>
    <circle cx="185" cy="340" r="7"/>
    <circle cx="255" cy="322" r="8"/>
    <circle cx="312" cy="278" r="8"/>
    <circle cx="330" cy="120" r="7"/>
    <circle cx="282" cy="70" r="8"/>
    <circle cx="205" cy="52" r="7"/>
    <circle cx="130" cy="72" r="8"/>
  </g>
  <!-- inner Fangs -->
  <g fill="#1b2030" stroke="#e8f0f8" stroke-opacity="0.2" stroke-width="1.2">
    <circle cx="140" cy="180" r="6"/>
    <circle cx="255" cy="160" r="6"/>
    <circle cx="190" cy="290" r="6"/>
  </g>

  <!-- Harbor gap pier lights (green north / red south) -->
  <circle cx="322" cy="176" r="5" fill="#57c785"/>
  <circle cx="322" cy="176" r="11" fill="none" stroke="#57c785" stroke-opacity="0.4"/>
  <circle cx="322" cy="224" r="5" fill="#e06a5a"/>
  <circle cx="322" cy="224" r="11" fill="none" stroke="#e06a5a" stroke-opacity="0.4"/>

  <!-- Ships -->
  <g>
    <path d="M118 236 L134 231 L137 238 L121 243 Z" fill="#46536e" stroke="#e8a838" stroke-opacity="0.7"/>
    <circle cx="122" cy="240" r="2.4" fill="#ffd88f"/>
    <path d="M282 300 L296 296 L298 302 L284 306 Z" fill="#46536e" stroke="#8fa3bd" stroke-opacity="0.6"/>
    <circle cx="285" cy="303" r="2" fill="#ffd88f"/>
  </g>

  <!-- Fog banks -->
  <ellipse cx="110" cy="110" rx="90" ry="52" fill="url(#fog1)"/>
  <ellipse cx="310" cy="330" rx="100" ry="58" fill="url(#fog1)"/>

  <!-- Lighthouse island -->
  <circle cx="200" cy="200" r="34" fill="#161c2c" stroke="#e8f0f8" stroke-opacity="0.25"/>
  <circle cx="200" cy="200" r="19" fill="#dde6ee"/>
  <circle cx="200" cy="200" r="19" fill="none" stroke="#8fa0b4"/>
  <circle cx="200" cy="200" r="26" fill="url(#lamp)"/>
  <circle cx="200" cy="200" r="9" fill="#ffd88f"/>
  <circle cx="200" cy="200" r="4.5" fill="#fff3d0"/>
</svg>
