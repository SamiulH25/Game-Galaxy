<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Patisserie Ledger — Game Galaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,700;1,400&family=Source+Sans+3:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
  <script src="../bridge.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="marble-bg" aria-hidden="true"></div>
    <div id="phaser-host" aria-label="Patisserie Ledger playfield"></div>

    <div id="hud-top" class="hidden">
      <div class="hud-item">
        <span class="hud-label">Moves</span>
        <span id="hud-moves" class="hud-value">—</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Timer</span>
        <span id="hud-timer" class="hud-value">—</span>
      </div>
      <div class="hud-item hud-wide">
        <span class="hud-label">Objectives</span>
        <span id="hud-objectives" class="hud-value hud-objectives">—</span>
      </div>
    </div>

    <div id="toolbar" class="toolbar hidden">
      <button type="button" id="btn-pause" class="tool-btn" title="Pause (P)">Pause</button>
      <button type="button" id="btn-booster" class="tool-btn" title="Use crafted booster">Booster</button>
      <button type="button" id="btn-quit" class="tool-btn secondary" title="Back to map">Map</button>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-content">
        <h1 class="game-title">Patisserie Ledger</h1>
        <p class="subtitle">Copper Kiln District</p>
        <div id="overlay-body"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=7"></script>
  <script src="js/map-layout.js?v=7"></script>
  <script src="js/engine.js?v=7"></script>
  <script src="js/levels.js?v=7"></script>
  <script src="js/crafting.js?v=7"></script>
  <script src="js/guide.js?v=7"></script>
  <script src="js/audio.js?v=7"></script>
  <script src="js/textures.js?v=7"></script>
  <script src="js/scenes.js?v=7"></script>
  <script src="js/main.js?v=7"></script>
</body>
</html>
